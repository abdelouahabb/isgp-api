<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISGP — Jour 2.5 : Jinja2, Formulaires &amp; Upload Multipart</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #1e3a5f; color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; display: grid; gap: 16px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    input { padding: 7px 10px; border: 1px solid #94a3b8; border-radius: 6px; }
    button, a.btn { background: #1e3a5f; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; font-size: 0.88rem; }
    a.btn { background: #0f766e; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>ISGP — Jour 2.5 : Service Hybride Jinja2 (/formations) &amp; API JSON / Multipart</h1>
  </header>
  <main>
    <section class="card">
      <h2>1. Ajouter une formation en JSON via fetch() sur POST /formations</h2>
      <div class="row">
        <input id="titre" value="Conception RESTful" placeholder="Titre" />
        <input id="jours" type="number" value="4" style="width:75px;" />
        <input id="salle" value="Salle C" style="width:110px;" />
        <button onclick="creerJson()">POST /formations (JSON)</button>
        <a class="btn" href="/formations" target="_blank">Ouvrir Formulaire HTML /formations</a>
      </div>
      <h2>2. Simuler un Upload Multipart vers POST /formations/upload-syllabus</h2>
      <div class="row">
        <input id="code_f" value="API-301" style="width:110px;" />
        <button onclick="testerUpload()">Envoyer PDF de demonstration (FormData)</button>
      </div>
      <pre id="sortie">{}</pre>
    </section>
  </main>
  <script>
    async function creerJson() {
      const r = await fetch("/formations", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          titre: document.getElementById("titre").value,
          duree_jours: Number(document.getElementById("jours").value),
          salle: document.getElementById("salle").value
        })
      });
      document.getElementById("sortie").textContent = `HTTP ${r.status}\n` + JSON.stringify(await r.json(), null, 2);
    }
    async function testerUpload() {
      const fd = new FormData();
      fd.append("code_formation", document.getElementById("code_f").value);
      fd.append("document_pdf", new Blob(["%PDF-1.4 Syllabus ISGP"], { type: "application/pdf" }), "syllabus isgp.pdf");
      const r = await fetch("/formations/upload-syllabus", { method: "POST", body: fd });
      document.getElementById("sortie").textContent = `HTTP ${r.status}\n` + JSON.stringify(await r.json(), null, 2);
    }
  </script>
</body>
</html>
