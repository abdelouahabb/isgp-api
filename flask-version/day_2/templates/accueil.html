<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>{{ organisme }} — {{ intitule }}</title>
</head>
<body>
  <header>
    <h1>{{ organisme }} : {{ intitule }}</h1>
    <p>Version de l'API : <strong>{{ version_api }}</strong></p>
  </header>
  <main>
    <h2>Modules du séminaire (rendus par boucle Jinja2) :</h2>
    <ul>
      {% for mod in modules %}
      <li>{{ mod }}</li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
