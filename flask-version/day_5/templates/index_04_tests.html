<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISGP — Jour 5.4 : Tests Automatises &amp; Production WSGI</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #1e3a5f; color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    input { padding: 7px 10px; border: 1px solid #94a3b8; border-radius: 6px; }
    button, a.btn { background: #1e3a5f; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; font-size: 0.88rem; }
    button.err { background: #b91c1c; }
    a.btn { background: #0f766e; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>ISGP — Jour 5.4 : Calculateur TVA (API JSON &amp; Formulaire Jinja2)</h1>
  </header>
  <main>
    <section class="card">
      <div class="row">
        <input id="ht" type="number" value="1000" />
        <button onclick="calculer(Number(document.getElementById('ht').value))">POST /api/calcul-taxe</button>
        <button class="err" onclick="calculer(-50)">Tester Montant Negatif (422)</button>
        <a class="btn" href="/formulaire-taxe" target="_blank">Ouvrir Formulaire HTML /formulaire-taxe</a>
      </div>
      <pre id="sortie">{}</pre>
    </section>
  </main>
  <script>
    async function calculer(montant_ht) {
      const r = await fetch("/api/calcul-taxe", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ montant_ht })
      });
      document.getElementById("sortie").textContent = `HTTP ${r.status}\n` + JSON.stringify(await r.json(), null, 2);
    }
    calculer(1000);
  </script>
</body>
</html>
