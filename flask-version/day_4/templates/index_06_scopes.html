<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISGP — Jour 4.6 : AuthN (401) vs AuthZ (403 : RBAC, Scopes, Anti-BOLA)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #1e3a5f; color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    button { background: #1e3a5f; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    button.warn { background: #b45309; }
    button.sec { background: #0f766e; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>ISGP — Jour 4.6 : AuthN (401) vs AuthZ (403 RBAC, OAuth2 Scopes &amp; Anti-BOLA)</h1>
  </header>
  <main>
    <section class="card">
      <div class="row">
        <button class="warn" onclick="appeler('/api/dossiers/101', '')">1. Sans Jeton -> 401 AuthN</button>
        <button class="sec" onclick="appeler('/api/dossiers/101', jetons.amine)">2. Amine lit Dossier #101 -> 200</button>
        <button class="warn" onclick="appeler('/api/dossiers/102', jetons.amine)">3. Amine lit Dossier Sara #102 -> 403 BOLA</button>
        <button class="warn" onclick="appeler('/api/admin/audit', jetons.amine)">4. Amine sur Audit -> 403 RBAC/Scope</button>
        <button class="sec" onclick="appeler('/api/admin/audit', jetons.directeur)">5. Directeur sur Audit -> 200</button>
      </div>
      <pre id="sortie">Initialisation des jetons de demonstration...</pre>
    </section>
  </main>
  <script>
    let jetons = { amine: "", directeur: "" };
    async function init() {
      const r = await fetch("/api/auth/tokens-demo");
      jetons = await r.json();
      await appeler("/api/dossiers/101", jetons.amine);
    }
    async function appeler(url, tok) {
      const headers = tok ? { "Authorization": `Bearer ${tok}` } : {};
      const r = await fetch(url, { headers });
      document.getElementById("sortie").textContent = `GET ${url} -> HTTP ${r.status}\n` + JSON.stringify(await r.json(), null, 2);
    }
    init();
  </script>
</body>
</html>
