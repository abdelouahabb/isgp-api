<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISGP — Jour 4.3 : Rate Limiting HTTP 429</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #1e3a5f; color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; }
    button { background: #1e3a5f; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 8px; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>ISGP — Jour 4.3 : Rate Limiting ({{ limite }} requetes / {{ fenetre }}s -> HTTP 429)</h1>
  </header>
  <main>
    <section class="card">
      <p>Cliquez plusieurs fois rapidement pour observer <code>X-RateLimit-Remaining</code> puis le blocage <code>429 Too Many Requests</code> avec <code>Retry-After</code>.</p>
      <button onclick="appeler()">GET /api/catalogue-protege</button>
      <button onclick="rafale()">Rafale de 4 requetes</button>
      <pre id="sortie">{}</pre>
    </section>
  </main>
  <script>
    async function appeler() {
      const r = await fetch("/api/catalogue-protege");
      const data = await r.json();
      document.getElementById("sortie").textContent = JSON.stringify({
        status: r.status,
        "X-RateLimit-Limit": r.headers.get("X-RateLimit-Limit"),
        "X-RateLimit-Remaining": r.headers.get("X-RateLimit-Remaining"),
        "Retry-After": r.headers.get("Retry-After"),
        body: data
      }, null, 2);
    }
    async function rafale() {
      const journal = [];
      for (let i = 1; i <= 4; i++) {
        const r = await fetch("/api/catalogue-protege");
        journal.push({ appel: i, status: r.status, restant: r.headers.get("X-RateLimit-Remaining"), retry_after: r.headers.get("Retry-After"), body: await r.json() });
      }
      document.getElementById("sortie").textContent = JSON.stringify(journal, null, 2);
    }
  </script>
</body>
</html>
