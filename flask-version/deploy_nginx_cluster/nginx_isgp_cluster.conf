# ==============================================================================
# FICHIER : /etc/nginx/sites-available/isgp_cluster.conf
# ARCHITECTURE DE PRODUCTION COMPLÈTE (Flask / Gunicorn (WSGI)) :
#   1. Load Balancing sur 4 instances locales (127.0.0.1:8001..8004) + Failover.
#   2. Délestage statique (/static/) par le noyau Linux (sendfile on -> 0% CPU Python).
#   3. Bouclier segmenté anti-saturation RAM (client_max_body_size -> HTTP 413 en bordure).
#   4. Délégation complète d'Upload à Nginx ($request_body_file -> 0 octet transmis à Python !).
#   5. Téléchargement privé haute vitesse via X-Accel-Redirect (location internal).
#   6. Streaming Temps Réel SSE (proxy_buffering off) & WebSockets (Upgrade 101).
# ==============================================================================

upstream isgp_flask_cluster {
    least_conn;

    # Passive Health Check : 3 échecs -> retrait automatique pendant 15s (Zero-Downtime Failover)
    server 127.0.0.1:8001 weight=1 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8002 weight=1 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8003 weight=1 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8004 weight=1 max_fails=3 fail_timeout=15s;

    keepalive 32;
}

log_format cluster_audit '$remote_addr - [$time_local] "$request" status=$status '
                         'req_id=$request_id upstream_node=$upstream_addr '
                         'upstream_time=${upstream_response_time}s total_time=${request_time}s';

server {
    listen 80;
    server_name api.isgp.dz localhost;

    access_log /var/log/nginx/isgp_cluster_access.log cluster_audit;
    error_log  /var/log/nginx/isgp_cluster_error.log warn;

    # ==========================================================================
    # 1. BOUCLIER GLOBAL STRICT SUR LES ROUTES JSON (1 Mo MAX PAR DÉFAUT)
    # ==========================================================================
    # N'ouvrez JAMAIS 50 Mo sur tout le serveur ! Toute requête > 1 Mo sur /login
    # ou /api/v1/formations est rejetée en 0.1 ms par Nginx (413) avant de toucher Python.
    client_max_body_size 1M;
    client_body_timeout  12s;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ==========================================================================
    # 2. DÉLESTAGE DES FICHIERS STATIQUES PUBLICS (0% CPU PYTHON)
    # ==========================================================================
    location /static/ {
        alias /home/abdelouahab/isgp-api/static/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Served-By "Nginx-Direct-Static-Engine" always;
    }

    # ==========================================================================
    # 3. DÉLÉGATION TOTALE D'UPLOAD À NGINX (OFFLOAD DISQUE ZÉRO-COPIE)
    # ==========================================================================
    # Nginx absorbe les clients 3G lents en C, écrit le binaire sur disque NVMe,
    # SUPPRIME le corps de la requête interne et n'envoie à Python que le chemin du fichier !
    location = /api/v1/upload-offload {
        client_max_body_size 25M;
        client_body_in_file_only clean;
        client_body_temp_path /var/spool/isgp_nginx_uploads 1 2;

        # Magie de l'offload : Python reçoit 0 octet de Body, uniquement les en-têtes !
        proxy_pass_request_body off;
        proxy_set_header Content-Length       "";
        proxy_set_header X-Uploaded-File-Path $request_body_file;
        proxy_set_header X-Uploaded-Bytes     $content_length;
        proxy_set_header X-Original-Filename  $http_x_filename;
        proxy_set_header X-Request-ID         $request_id;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $scheme;

        proxy_pass http://isgp_flask_cluster;
    }

    # ==========================================================================
    # 4. UPLOAD EN STREAMING DIRECT VERS PYTHON (SANS TAMPON DISQUE NGINX)
    # ==========================================================================
    location = /api/v1/stream-upload {
        client_max_body_size 25M;
        # En Flask WSGI, on garde par défaut 'proxy_request_buffering on;' sur les uploads
        # classiques afin que Nginx absorbe les clients mobiles 3G lents sans bloquer un thread Gunicorn !
        # On n'active 'proxy_request_buffering off;' que sur une route dédiée au streaming pur :
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://isgp_flask_cluster;
    }

    # ==========================================================================
    # 5. TÉLÉCHARGEMENT PRIVÉ PROTÉGÉ PAR PYTHON (X-ACCEL-REDIRECT)
    # ==========================================================================
    # 'internal;' interdit tout accès direct depuis Internet ! Seul un en-tête interne
    # 'X-Accel-Redirect: /_protected_exports/doc.pdf' émis par Python après vérification JWT l'active.
    location /_protected_exports/ {
        internal;
        alias /var/data/isgp_exports/;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==========================================================================
    # 6. FLUX TEMPS RÉEL : SSE (SANS BUFFERING) & WEBSOCKETS (UPGRADE 101)
    # ==========================================================================
    location /api/v1/sse {
        proxy_pass http://isgp_flask_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /ws/ {
        proxy_pass http://isgp_flask_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ==========================================================================
    # 7. REVERSE PROXY & LOAD BALANCING GÉNÉRAL VERS LES 4 NŒUDS PYTHON
    # ==========================================================================
    location / {
        proxy_pass http://isgp_flask_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Transmission de l'identité client et de l'ID de corrélation (lu par Werkzeug ProxyFix)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        add_header X-Load-Balanced-By $upstream_addr always;
        add_header X-Upstream-Status  $upstream_status always;

        proxy_connect_timeout 3s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
        proxy_next_upstream   error timeout http_502 http_503 http_504;
    }
}
