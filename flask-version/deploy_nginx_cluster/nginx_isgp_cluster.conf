# ==============================================================================
# FICHIER : /etc/nginx/sites-available/isgp_cluster.conf
# OBJECTIF :
#   1. Répartir la charge (Load Balancing) entre 4 instances Flask/Gunicorn
#      écoutant en local sur 127.0.0.1:8001, 8002, 8003 et 8004.
#   2. Servir directement les fichiers statiques (/static/) depuis le disque
#      via le noyau Linux (sendfile) sans jamais solliciter Python/Flask.
# ==============================================================================

# 1. DÉFINITION DU GROUPE DE 4 INSTANCES BACKEND (UPSTREAM CLUSTER)
upstream isgp_flask_cluster {
    # Stratégie de répartition :
    # - Par défaut (aucune directive) : Round-Robin (1 -> 2 -> 3 -> 4 -> 1...)
    # - least_conn : Envoie la requête à l'instance ayant le moins de requêtes en cours (Recommandé en API)
    # - ip_hash    : Un même client (IP) est toujours dirigé vers la même instance
    least_conn;

    # Les 4 instances Flask/Gunicorn avec détection automatique de panne (Passive Health Check) :
    # Si une instance échoue 3 fois (max_fails=3), Nginx la retire du pool pendant 15 secondes (fail_timeout=15s)
    # et bascule automatiquement 100% du trafic sur les 3 instances restantes (Zero-Downtime Failover) !
    server 127.0.0.1:8001 weight=1 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8002 weight=1 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8003 weight=1 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8004 weight=1 max_fails=3 fail_timeout=15s;

    # Maintien d'un pool de connexions TCP persistantes entre Nginx et les 4 instances Flask
    keepalive 32;
}

# Format de journalisation enrichi affichant quelle instance Flask ($upstream_addr) a répondu
log_format cluster_audit '$remote_addr - [$time_local] "$request" status=$status '
                         'upstream_node=$upstream_addr upstream_time=${upstream_response_time}s '
                         'total_time=${request_time}s';

server {
    listen 80;
    server_name api.isgp.dz localhost;

    access_log /var/log/nginx/isgp_cluster_access.log cluster_audit;
    error_log  /var/log/nginx/isgp_cluster_error.log warn;

    # Limite maximale du corps HTTP (bloque les uploads géants en 413 Payload Too Large avant Flask)
    client_max_body_size 10M;

    # Compression Gzip à la volée pour les réponses JSON, CSS et JavaScript
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ==========================================================================
    # 2. DÉLESTAGE DES FICHIERS STATIQUES (SERVIS DIRECTEMENT PAR NGINX)
    # ==========================================================================
    # Toute requête commençant par /static/ (styles.css, app.js, images, PDF)
    # est servie directement par Nginx depuis le disque dur : Python n'est JAMAIS appelé !
    location /static/ {
        alias /home/abdelouahab/isgp-api/static/;

        # Optimisations noyau Linux : transfert direct Disque -> Carte Réseau (Zero-Copy)
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Mise en cache navigateur (30 jours) et en-tête de sécurité anti-sniffing
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Served-By "Nginx-Direct-Static-Engine" always;
    }

    # ==========================================================================
    # 3. REVERSE PROXY & LOAD BALANCING VERS LES 4 INSTANCES FLASK
    # ==========================================================================
    location / {
        proxy_pass http://isgp_flask_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Transmission de la véritable identité réseau du client à Flask (lu par ProxyFix)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # En-têtes de diagnostic indiquant au client quelle instance (8001..8004) a traité sa requête
        add_header X-Load-Balanced-By $upstream_addr always;
        add_header X-Upstream-Status  $upstream_status always;

        # Timeouts et basculement automatique sur l'instance suivante en cas d'erreur
        proxy_connect_timeout 3s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
        proxy_next_upstream   error timeout http_502 http_503 http_504;
    }
}
