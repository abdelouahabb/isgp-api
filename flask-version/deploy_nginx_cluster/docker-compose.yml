# ==============================================================================
# FICHIER : deploy_nginx_cluster/docker-compose.yml
# OBJECTIF : Déployer en 1 commande (`docker compose up -d`) :
#   - 4 conteneurs Flask/Gunicorn (flask_node_1 à flask_node_4 sur 8001..8004)
#   - 1 conteneur Nginx Load Balancer & Static File Server (port 80)
# ==============================================================================
services:
  flask_node_1:
    build: ..
    environment:
      - INSTANCE_ID=flask-node-1
      - PORT=8001
    command: gunicorn -w 2 -b 0.0.0.0:8001 deploy_nginx_cluster.instance_flask:app

  flask_node_2:
    build: ..
    environment:
      - INSTANCE_ID=flask-node-2
      - PORT=8002
    command: gunicorn -w 2 -b 0.0.0.0:8002 deploy_nginx_cluster.instance_flask:app

  flask_node_3:
    build: ..
    environment:
      - INSTANCE_ID=flask-node-3
      - PORT=8003
    command: gunicorn -w 2 -b 0.0.0.0:8003 deploy_nginx_cluster.instance_flask:app

  flask_node_4:
    build: ..
    environment:
      - INSTANCE_ID=flask-node-4
      - PORT=8004
    command: gunicorn -w 2 -b 0.0.0.0:8004 deploy_nginx_cluster.instance_flask:app

  nginx_lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx_isgp_cluster.conf:/etc/nginx/conf.d/default.conf:ro
      - ../static:/home/abdelouahab/isgp-api/static:ro
    depends_on:
      - flask_node_1
      - flask_node_2
      - flask_node_3
      - flask_node_4
