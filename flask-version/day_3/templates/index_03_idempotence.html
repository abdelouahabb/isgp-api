<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISGP — Jour 3.3 : PUT vs PATCH &amp; Idempotency-Key</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #1e3a5f; color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    input { padding: 7px 10px; border: 1px solid #94a3b8; border-radius: 6px; }
    button { background: #1e3a5f; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button.sec { background: #0f766e; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>ISGP — Jour 3.3 : Idempotency-Key (POST), PUT Complet et PATCH Partiel</h1>
  </header>
  <main>
    <section class="card">
      <div class="row">
        <input id="idem" value="cle-client-2026-A" placeholder="Idempotency-Key" />
        <input id="titre" value="Audit Architecture REST" placeholder="Titre" />
        <button onclick="postIdem()">POST /api/v1/formations (avec Idempotency-Key)</button>
      </div>
      <div class="row">
        <button class="sec" onclick="testerPatch()">PATCH /api/v1/formations/1 (salle seule)</button>
        <button onclick="testerPut()">PUT /api/v1/formations/1 (remplacement complet)</button>
      </div>
      <pre id="sortie">{}</pre>
    </section>
  </main>
  <script>
    async function postIdem() {
      const r = await fetch("/api/v1/formations", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Idempotency-Key": document.getElementById("idem").value
        },
        body: JSON.stringify({ titre: document.getElementById("titre").value, duree_jours: 3 })
      });
      document.getElementById("sortie").textContent = `POST -> HTTP ${r.status}\n` + JSON.stringify(await r.json(), null, 2);
    }
    async function testerPatch() {
      const r = await fetch("/api/v1/formations/1", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ salle: "Amphitheatre Alger" })
      });
      document.getElementById("sortie").textContent = `PATCH -> HTTP ${r.status}\n` + JSON.stringify(await r.json(), null, 2);
    }
    async function testerPut() {
      const r = await fetch("/api/v1/formations/1", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ titre: "Architecture REST v2", duree_jours: 5, salle: "Salle Principale" })
      });
      document.getElementById("sortie").textContent = `PUT -> HTTP ${r.status}\n` + JSON.stringify(await r.json(), null, 2);
    }
  </script>
</body>
</html>
