<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISGP — Jour 3.2 : Persistance SQLite CRUD</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #1e3a5f; color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; display: grid; gap: 16px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    input { padding: 7px 10px; border: 1px solid #94a3b8; border-radius: 6px; }
    button, a.btn { background: #1e3a5f; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; font-size: 0.85rem; }
    button.del { background: #b91c1c; }
    a.btn { background: #0f766e; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
    th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.84rem; }
  </style>
</head>
<body>
  <header>
    <h1>ISGP — Jour 3.2 : API CRUD Persistance SQLite (/api/formations)</h1>
  </header>
  <main>
    <section class="card">
      <div class="row">
        <input id="titre" value="Transactions ACID SQLite" placeholder="Titre" />
        <input id="jours" type="number" value="4" style="width:70px;" />
        <input id="salle" value="Salle B" style="width:110px;" />
        <button onclick="ajouter()">POST /api/formations</button>
        <a class="btn" href="/formations-sqlite" target="_blank">Ouvrir Formulaire Jinja2 /formations-sqlite</a>
      </div>
      <table>
        <thead><tr><th>ID</th><th>Titre</th><th>Jours</th><th>Salle</th><th>Actions API</th></tr></thead>
        <tbody id="lignes"></tbody>
      </table>
      <pre id="journal">Pret.</pre>
    </section>
  </main>
  <script>
    async function charger() {
      const r = await fetch("/api/formations");
      const items = await r.json();
      document.getElementById("lignes").innerHTML = items.map(f =>
        `<tr><td>${f.id}</td><td>${f.titre}</td><td>${f.duree_jours}</td><td>${f.salle}</td>
         <td><button onclick="renommerSalle(${f.id})">PUT Salle Labo</button>
             <button class="del" onclick="supprimer(${f.id})">DELETE</button></td></tr>`
      ).join("");
    }
    async function ajouter() {
      const r = await fetch("/api/formations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          titre: document.getElementById("titre").value,
          duree_jours: Number(document.getElementById("jours").value),
          salle: document.getElementById("salle").value
        })
      });
      document.getElementById("journal").textContent = `POST -> HTTP ${r.status}\n` + JSON.stringify(await r.json(), null, 2);
      charger();
    }
    async function renommerSalle(id) {
      const r = await fetch(`/api/formations/${id}`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ salle: "Labo SQL" })
      });
      document.getElementById("journal").textContent = `PUT /api/formations/${id} -> HTTP ${r.status}\n` + JSON.stringify(await r.json(), null, 2);
      charger();
    }
    async function supprimer(id) {
      const r = await fetch(`/api/formations/${id}`, { method: "DELETE" });
      document.getElementById("journal").textContent = `DELETE /api/formations/${id} -> HTTP ${r.status}\n` + JSON.stringify(await r.json(), null, 2);
      charger();
    }
    charger();
  </script>
</body>
</html>
