<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISGP — Jour 3.4 : Gestion Globale des Erreurs JSON</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #1e3a5f; color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    button { background: #1e3a5f; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button.warn { background: #b45309; }
    button.err { background: #b91c1c; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>ISGP — Jour 3.4 : Intercepteurs Globaux (@app.errorhandler 404, 405, 500)</h1>
  </header>
  <main>
    <section class="card">
      <p>Verifiez qu'aucune exception ni route inconnue ne renvoie de page HTML brute au client API :</p>
      <div class="actions">
        <button onclick="tester('/api/v1/division?a=100&b=4', 'GET')">GET /api/v1/division?a=100&amp;b=4 (200)</button>
        <button class="warn" onclick="tester('/api/v1/introuvable', 'GET')">Tester 404 Not Found</button>
        <button class="warn" onclick="tester('/api/v1/division', 'DELETE')">Tester 405 Method Not Allowed</button>
        <button class="err" onclick="tester('/api/v1/division?a=100&b=0', 'GET')">Tester Division par Zero (500 JSON)</button>
      </div>
      <div id="meta" style="font-weight:600; margin-bottom:6px;"></div>
      <pre id="sortie">{}</pre>
    </section>
  </main>
  <script>
    async function tester(url, method) {
      const r = await fetch(url, { method });
      const data = await r.json();
      document.getElementById("meta").textContent = `${method} ${url} -> HTTP ${r.status} (${r.headers.get("Content-Type")})`;
      document.getElementById("sortie").textContent = JSON.stringify(data, null, 2);
    }
    tester("/api/v1/division?a=100&b=4", "GET");
  </script>
</body>
</html>
