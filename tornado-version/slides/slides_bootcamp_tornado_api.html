<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>ISGP — Support de Présentation (Slides Tornado &amp; Ingénierie des APIs)</title>
  <style>
/* ==========================================================================
   ISGP — Moteur de Présentation (Slides 16:9 Tornado & Ingénierie des APIs)
   Optimisé pour vidéoprojecteur, Plein Écran Paysage, Mode Clair/Sombre & PDF
   ========================================================================== */

:root,
[data-theme="dark"] {
  --sl-bg: #070b14;
  --sl-stage-bg: linear-gradient(155deg, #0d1424 0%, #111827 65%, #131629 100%);
  --sl-surface: rgba(30, 41, 59, 0.58);
  --sl-surface-strong: #172033;
  --sl-border: rgba(148, 163, 184, 0.18);
  --sl-border-strong: rgba(139, 92, 246, 0.45);
  --sl-text: #f8fafc;
  --sl-text-sec: #cbd5e1;
  --sl-text-muted: #94a3b8;
  --sl-accent: #8b5cf6;
  --sl-accent-soft: rgba(139, 92, 246, 0.16);
  --sl-accent-text: #c4b5fd;
  --sl-cyan: #38bdf8;
  --sl-cyan-soft: rgba(56, 189, 248, 0.14);
  --sl-emerald: #34d399;
  --sl-def-bg: rgba(139, 92, 246, 0.11);
  --sl-code-bg: #090e1a;
  --sl-code-text: #e2e8f0;
  --sl-takeaway-bg: rgba(15, 23, 42, 0.85);
  --sl-topbar-bg: rgba(10, 15, 28, 0.92);
  --sl-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
}

[data-theme="light"] {
  --sl-bg: #e2e8f0;
  --sl-stage-bg: linear-gradient(155deg, #ffffff 0%, #f8fafc 70%, #f3f0ff 100%);
  --sl-surface: #f8fafc;
  --sl-surface-strong: #ffffff;
  --sl-border: #cbd5e1;
  --sl-border-strong: #7c3aed;
  --sl-text: #0f172a;
  --sl-text-sec: #1e293b;
  --sl-text-muted: #475569;
  --sl-accent: #6d28d9;
  --sl-accent-soft: rgba(109, 40, 217, 0.1);
  --sl-accent-text: #5b21b6;
  --sl-cyan: #0284c7;
  --sl-cyan-soft: rgba(2, 132, 199, 0.1);
  --sl-emerald: #059669;
  --sl-def-bg: #f5f3ff;
  --sl-code-bg: #0f172a;
  --sl-code-text: #f1f5f9;
  --sl-takeaway-bg: #f1f5f9;
  --sl-topbar-bg: rgba(255, 255, 255, 0.95);
  --sl-shadow: 0 18px 45px rgba(15, 23, 42, 0.14);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--sl-bg);
  color: var(--sl-text);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body.deck-screen-mode {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Barre supérieure de contrôle */
.deck-topbar {
  height: 52px;
  min-height: 52px;
  background: var(--sl-topbar-bg);
  border-bottom: 1px solid var(--sl-border);
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 30;
}

.deck-topbar-left,
.deck-topbar-center,
.deck-topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.deck-brand-badge {
  background: linear-gradient(135deg, #7c3aed, #4f46e5);
  color: #ffffff;
  font-weight: 800;
  font-size: 11.5px;
  letter-spacing: 0.06em;
  padding: 4px 9px;
  border-radius: 6px;
  text-decoration: none;
}

.deck-back-link {
  color: var(--sl-text-sec);
  text-decoration: none;
  font-size: 12.5px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid var(--sl-border);
  background: var(--sl-surface);
  white-space: nowrap;
}

.deck-back-link:hover {
  border-color: var(--sl-accent);
  color: var(--sl-text);
}

.deck-part-select,
.deck-search-input {
  background: var(--sl-surface-strong);
  color: var(--sl-text);
  border: 1px solid var(--sl-border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12.5px;
  outline: none;
}

.deck-part-select {
  max-width: 310px;
  font-weight: 600;
}

.deck-search-input {
  width: 195px;
}

.deck-part-select:focus,
.deck-search-input:focus {
  border-color: var(--sl-accent);
}

.deck-btn {
  background: var(--sl-surface);
  color: var(--sl-text);
  border: 1px solid var(--sl-border);
  border-radius: 6px;
  padding: 6px 11px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.deck-btn:hover {
  border-color: var(--sl-accent);
}

.deck-btn-primary {
  background: linear-gradient(135deg, #7c3aed, #6d28d9);
  color: #ffffff;
  border-color: transparent;
}

/* Zone centrale 16:9 */
.deck-viewport {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 28px 10px;
  position: relative;
  overflow: hidden;
}

.slide-card {
  width: min(1380px, 100%);
  height: min(776px, 100%);
  background: var(--sl-stage-bg);
  border: 1px solid var(--sl-border);
  border-top: 4px solid var(--sl-accent);
  border-radius: 16px;
  box-shadow: var(--sl-shadow);
  padding: 32px 46px 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow-y: auto;
}

/* En-tête d'une diapositive */
.slide-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.slide-badges {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.slide-part-pill {
  background: var(--sl-accent-soft);
  color: var(--sl-accent-text);
  border: 1px solid var(--sl-border-strong);
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 4px 11px;
  border-radius: 999px;
}

.slide-tag-pill {
  background: var(--sl-cyan-soft);
  color: var(--sl-cyan);
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
}

.slide-counter-pill {
  font-family: "JetBrains Mono", "Fira Code", monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--sl-text-muted);
  background: var(--sl-surface);
  border: 1px solid var(--sl-border);
  padding: 4px 12px;
  border-radius: 999px;
}

.slide-headline h1 {
  margin: 0 0 6px 0;
  font-size: clamp(24px, 2.5vw, 35px);
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.18;
  color: var(--sl-text);
}

.slide-subtitle {
  margin: 0 0 16px 0;
  font-size: clamp(14px, 1.25vw, 17.5px);
  color: var(--sl-text-muted);
  font-weight: 500;
}

/* Bloc Définition */
.slide-def-box {
  background: var(--sl-def-bg);
  border: 1px solid var(--sl-border);
  border-left: 5px solid var(--sl-accent);
  border-radius: 11px;
  padding: 15px 20px;
  margin-bottom: 18px;
}

.slide-def-kicker {
  display: inline-block;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--sl-accent-text);
  margin-bottom: 5px;
}

.slide-def-text {
  margin: 0;
  font-size: clamp(15.5px, 1.38vw, 19.5px);
  line-height: 1.52;
  color: var(--sl-text);
  font-weight: 500;
}

/* Corps principal adaptatif */
.slide-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 14px;
  min-height: 0;
}

.slide-body.layout-split {
  display: grid;
  grid-template-columns: 1.02fr 1.08fr;
  gap: 22px;
  align-items: stretch;
}

.slide-points-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  justify-content: center;
}

.slide-points-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 13px;
}

.slide-point-card {
  background: var(--sl-surface);
  border: 1px solid var(--sl-border);
  border-radius: 10px;
  padding: 12px 15px;
  display: flex;
  gap: 11px;
  align-items: flex-start;
}

.slide-point-index {
  min-width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--sl-accent-soft);
  color: var(--sl-accent-text);
  font-size: 12px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
}

.slide-point-content {
  font-size: clamp(13.8px, 1.12vw, 16px);
  line-height: 1.46;
  color: var(--sl-text-sec);
}

.slide-point-content strong {
  color: var(--sl-text);
  font-weight: 700;
}

/* Comparaison 2 colonnes */
.slide-compare-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.slide-compare-col {
  background: var(--sl-surface);
  border: 1px solid var(--sl-border);
  border-radius: 11px;
  padding: 14px 18px;
}

.slide-compare-col.col-left {
  border-top: 3px solid var(--sl-cyan);
}

.slide-compare-col.col-right {
  border-top: 3px solid var(--sl-emerald);
}

.slide-compare-title {
  margin: 0 0 9px 0;
  font-size: 15.5px;
  font-weight: 800;
  color: var(--sl-text);
}

.slide-compare-items {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.slide-compare-item {
  font-size: 14.2px;
  line-height: 1.44;
  color: var(--sl-text-sec);
  padding-left: 12px;
  border-left: 2px solid var(--sl-border-strong);
}

/* Bloc Fragment de Code */
.slide-code-panel {
  background: var(--sl-code-bg);
  border: 1px solid rgba(148, 163, 184, 0.24);
  border-radius: 11px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.slide-code-header {
  background: rgba(30, 41, 59, 0.72);
  border-bottom: 1px solid rgba(148, 163, 184, 0.2);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.slide-code-label {
  font-size: 12px;
  font-weight: 700;
  color: #cbd5e1;
}

.slide-code-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.slide-code-lang {
  font-family: monospace;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: #c4b5fd;
  background: rgba(139, 92, 246, 0.2);
  padding: 2px 7px;
  border-radius: 4px;
}

.slide-copy-btn {
  background: rgba(255, 255, 255, 0.08);
  color: #e2e8f0;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 4px;
  font-size: 11px;
  padding: 2px 8px;
  cursor: pointer;
}

.slide-code-pre {
  margin: 0;
  padding: 15px 18px;
  font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
  font-size: clamp(13px, 1.05vw, 15.2px);
  line-height: 1.56;
  color: var(--sl-code-text);
  overflow-x: auto;
  white-space: pre;
  flex: 1;
}

.tok-kw { color: #c084fc; font-weight: 600; }
.tok-str { color: #86efac; }
.tok-num { color: #fcd34d; }
.tok-cmt { color: #64748b; font-style: italic; }
.tok-dec { color: #38bdf8; font-weight: 600; }

/* Bandeau À retenir */
.slide-takeaway-bar {
  margin-top: 14px;
  background: var(--sl-takeaway-bg);
  border: 1px solid var(--sl-border);
  border-radius: 9px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: clamp(13.2px, 1.08vw, 15.2px);
  color: var(--sl-text-sec);
}

.slide-takeaway-tag {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--sl-emerald);
  white-space: nowrap;
}

/* Barre inférieure de navigation */
.deck-bottombar {
  height: 44px;
  min-height: 44px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: var(--sl-topbar-bg);
  border-top: 1px solid var(--sl-border);
}

.deck-progress-track {
  flex: 1;
  height: 6px;
  background: var(--sl-surface);
  border-radius: 999px;
  overflow: hidden;
}

.deck-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #7c3aed, #38bdf8);
  transition: width 0.2s ease;
}

.deck-nav-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.deck-hint {
  font-size: 12px;
  color: var(--sl-text-muted);
}

/* Vue Grille (Modale de toutes les diapositives) */
.deck-grid-overlay {
  position: fixed;
  inset: 0;
  background: rgba(7, 11, 20, 0.92);
  backdrop-filter: blur(8px);
  z-index: 80;
  display: flex;
  flex-direction: column;
  padding: 22px 30px;
}

.deck-grid-overlay.hidden {
  display: none;
}

.deck-grid-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  color: #f8fafc;
}

.deck-grid-cards {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 14px;
  padding-bottom: 24px;
}

.deck-mini-card {
  background: #111827;
  border: 1px solid rgba(148, 163, 184, 0.22);
  border-radius: 10px;
  padding: 13px 15px;
  cursor: pointer;
  text-align: left;
  color: #f1f5f9;
  transition: transform 0.14s ease, border-color 0.14s ease;
}

.deck-mini-card:hover,
.deck-mini-card.active {
  border-color: #8b5cf6;
  transform: translateY(-2px);
}

.deck-mini-top {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #c4b5fd;
  font-weight: 700;
  margin-bottom: 6px;
}

.deck-mini-title {
  font-size: 13.8px;
  font-weight: 700;
  line-height: 1.35;
  margin-bottom: 5px;
}

.deck-mini-sub {
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.35;
}

/* Conteneur d'impression PDF (masqué à l'écran) */
#deck-print-all {
  display: none;
}

@media (max-width: 980px) {
  .deck-topbar {
    height: auto;
    padding: 8px 12px;
    flex-wrap: wrap;
  }
  .slide-card {
    padding: 20px 22px;
    height: 100%;
  }
  .slide-body.layout-split,
  .slide-points-grid,
  .slide-compare-grid {
    grid-template-columns: 1fr;
  }
  .deck-hint {
    display: none;
  }
}

/* Impression / Export PDF 16:9 Paysage (1 diapositive par page) */
@media print {
  @page {
    size: 16in 9in;
    margin: 0;
  }
  html, body {
    background: #ffffff !important;
    color: #0f172a !important;
    overflow: visible !important;
    height: auto !important;
  }
  .deck-topbar,
  .deck-viewport,
  .deck-bottombar,
  .deck-grid-overlay {
    display: none !important;
  }
  #deck-print-all {
    display: block !important;
  }
  .print-slide-page {
    width: 16in;
    height: 9in;
    padding: 0.52in 0.68in;
    page-break-after: always;
    break-after: page;
    background: #ffffff !important;
    color: #0f172a !important;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-top: 6px solid #6d28d9;
  }
  .print-slide-page:last-child {
    page-break-after: auto;
    break-after: auto;
  }
}

</style>
</head>
<body class="deck-screen-mode">

  <header class="deck-topbar">
    <div class="deck-topbar-left">
      <a href="https://abdelouahabb.github.io/isgp-api/" class="deck-brand-badge">ISGP</a>
      <a href="https://abdelouahabb.github.io/isgp-api/cours/tornado/index.html" class="deck-back-link">&larr; Cours Tornado</a>
      <select id="deck-part-select" class="deck-part-select" aria-label="Choisir une partie"></select>
    </div>

    <div class="deck-topbar-center">
      <input
        id="deck-search-input"
        type="search"
        class="deck-search-input"
        placeholder="Rechercher (/ : REST, 401, IOLoop...)"
        aria-label="Rechercher une diapositive"
      />
      <button type="button" class="deck-btn" onclick="window.toggleDeckGrid()" title="Afficher la grille complète (Touche G)">
        Grille (G)
      </button>
    </div>

    <div class="deck-topbar-right">
      <button type="button" class="deck-btn" onclick="window.printAllSlides()" title="Imprimer ou enregistrer toutes les diapositives en PDF 16:9">
        Exporter PDF
      </button>
      <button type="button" id="deck-theme-btn" class="deck-btn" onclick="window.toggleDeckTheme()" title="Basculer Mode Clair / Mode Sombre (Touche T)">
        Mode Clair
      </button>
      <button type="button" class="deck-btn deck-btn-primary" onclick="window.toggleDeckFullscreen()" title="Basculer en Plein Écran Paysage (Touche F)">
        Plein Écran (F)
      </button>
    </div>
  </header>

  <main class="deck-viewport">
    <article id="slide-stage" class="slide-card" aria-live="polite"></article>
  </main>

  <footer class="deck-bottombar">
    <div class="deck-nav-controls">
      <button type="button" class="deck-btn" onclick="window.prevSlide()">&larr; Précédente</button>
      <button type="button" class="deck-btn deck-btn-primary" onclick="window.nextSlide()">Suivante &rarr;</button>
      <span id="deck-pos-label" class="deck-hint"></span>
    </div>
    <div class="deck-progress-track">
      <div id="deck-progress-fill" class="deck-progress-fill" style="width: 0%;"></div>
    </div>
    <span class="deck-hint">Clavier : &larr; / &rarr; / Espace &bull; Grille : G &bull; Recherche : / &bull; Plein Écran : F</span>
  </footer>

  <!-- Modale Grille de navigation rapide -->
  <section id="deck-grid-overlay" class="deck-grid-overlay hidden" aria-label="Grille des diapositives">
    <div class="deck-grid-header">
      <div>
        <strong style="font-size: 17px;">Vue d'ensemble des Diapositives — Python Tornado &amp; Ingénierie des APIs</strong>
        <span id="deck-grid-count" style="margin-left: 12px; font-size: 13px; color: #94a3b8;"></span>
      </div>
      <button type="button" class="deck-btn" onclick="window.closeDeckGrid()">Fermer (Échap)</button>
    </div>
    <div id="deck-grid-cards" class="deck-grid-cards"></div>
  </section>

 et lisibilité"], "right_title": "API Web", "right_items": ["Consommateur : script ou application", "Format : JSON structuré léger", "Priorité : stabilité et précision"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Le HTML habille l'information pour l'humain ; le JSON structure l'information pour la machine."}, {"number": 9, "part_id": "P1", "part_title": "Partie 1 — Culture Générale & Jargon des APIs", "tag": "Architecture Logicielle", "title": "Le principe de Découplage (Séparation Front-end / Back-end)", "subtitle": "Isoler la logique métier serveur des interfaces graphiques clientes", "definition": "Le découplage consiste à séparer l'application en deux briques indépendantes : un Back-end qui détient les règles et données, et un Front-end dédié à l'affichage.", "points": [{"label": "Évolution autonome", "text": "On peut refaire tout le design web ou créer une application mobile sans toucher au serveur."}, {"label": "Frontière nette", "text": "L'API HTTP agit comme l'unique point de passage contrôlé entre les deux mondes."}], "comparison": {"left_title": "Front-end (Présentation)", "left_items": ["Interface utilisateur et navigation", "S'exécute sur l'appareil client", "Ne stocke aucun secret serveur"], "right_title": "Back-end Tornado (Métier)", "right_items": ["Règles de gestion et calculs", "Accès sécurisé à la base de données", "Garant de l'intégrité des données"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Découpler le Front-end du Back-end multiplie la longévité et l'adaptabilité du système."}, {"number": 10, "part_id": "P1", "part_title": "Partie 1 — Culture Générale & Jargon des APIs", "tag": "Modèle Fondamental", "title": "Modèle Client-Serveur : Rôles et responsabilités", "subtitle": "Comprendre qui initie l'échange et qui détient l'autorité sur les données", "definition": "Dans une architecture Client-Serveur, le client prend toujours l'initiative de la demande tandis que le serveur écoute en permanence, traite la requête et renvoie son verdict.", "points": [{"label": "Asymétrie", "text": "Un seul serveur Tornado répond simultanément à des centaines de clients variés."}, {"label": "Autorité centrale", "text": "Le client n'est jamais digne de confiance : le serveur revérifie chaque donnée reçue."}], "comparison": {"left_title": "Le Client (Demandeur)", "left_items": ["Navigateur, mobile, curl ou autre serveur", "Initie la connexion réseau", "Formule la requête et affiche le résultat"], "right_title": "Le Serveur (Fournisseur)", "right_items": ["Processus Python Tornado en écoute", "Valide les droits et les entrées", "Exécute le traitement et répond"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Règle d'or back-end : ne jamais faire confiance aveuglément aux données envoyées par un client."}, {"number": 11, "part_id": "P1", "part_title": "Partie 1 — Culture Générale & Jargon des APIs", "tag": "Mécanique d'Échange", "title": "Cycle Requête (Request) / Réponse (Response)", "subtitle": "Le battement de coeur élémentaire de toute communication HTTP", "definition": "Tout appel d'API suit une séquence synchrone côté protocole : le client émet un message de requête complet, le serveur l'analyse et renvoie un message de réponse.", "points": [{"label": "1. Émission", "text": "Le client envoie un verbe d'action, une cible URL, des en-têtes et un corps optionnel."}, {"label": "2. Traitement", "text": "Tornado route l'appel vers le bon gestionnaire, interroge les données et prépare la sortie."}, {"label": "3. Retour", "text": "Le serveur répond avec un code de statut numérique explicite, ses en-têtes et les données."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Chaque interaction API se résume à une question structurée suivie d'une réponse qualifiée."}, {"number": 12, "part_id": "P1", "part_title": "Partie 1 — Culture Générale & Jargon des APIs", "tag": "Vocabulaire REST", "title": "Ressource vs Endpoint (Point de terminaison)", "subtitle": "Ne pas confondre l'objet métier manipulé avec l'adresse technique qui y mène", "definition": "Une ressource représente une entité métier abstraite du système (comme une formation), alors qu'un endpoint est l'adresse précise combinant méthode HTTP et chemin URL pour agir dessus.", "points": [{"label": "Une ressource, plusieurs accès", "text": "La ressource Formation se consulte, se modifie ou se supprime via divers endpoints."}, {"label": "Noms plutôt que verbes", "text": "On nomme la ressource au pluriel (/formations) et le verbe HTTP exprime l'action."}], "comparison": {"left_title": "Ressource (Quoi)", "left_items": ["Concept métier : une Formation", "Identifiée par /api/v1/formations/42", "Représentée en JSON ou en HTML"], "right_title": "Endpoint (Comment y accéder)", "right_items": ["Couple Verbe + Route exacte", "GET /api/v1/formations/42 (lecture)", "DELETE /api/v1/formations/42 (retrait)"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "La ressource est le sujet métier ; l'endpoint est la porte technique précise pour interagir avec elle."}, {"number": 13, "part_id": "P1", "part_title": "Partie 1 — Culture Générale & Jargon des APIs", "tag": "Transport des Données", "title": "Payload (Charge utile) & Sérialisation des données", "subtitle": "Transformer des objets mémoire Python en flux d'octets transmissibles sur le réseau", "definition": "Le payload désigne les données métier utiles transportées dans le corps d'un message HTTP, indépendamment des en-têtes techniques d'acheminement. La sérialisation convertit les objets mémoire en texte standard.", "points": [{"label": "Sérialisation (Sortie)", "text": "Convertir un dictionnaire Python en texte JSON UTF-8 prêt à voyager sur le câble réseau."}, {"label": "Désérialisation (Entrée)", "text": "Analyser le texte JSON reçu d'un client pour reconstruire un dictionnaire Python exploitable."}, {"label": "Interopérabilité", "text": "Un client Java, JavaScript ou Go comprend le même payload JSON sans c aque message tout le contexte nécessaire, notamment son jeton d'authentification.", "points": [{"label": "Montée en charge", "text": "N'importe quelle instance Tornado d'une ferme de serveurs peut répondre à n'importe quel appel."}, {"label": "Résilience", "text": "Redémarrer un processus serveur ne fait perdre aucune session mémoire critique en cours."}], "comparison": {"left_title": "Stateful (Avec état)", "left_items": ["Mémoire client gardée sur un serveur précis", "Difficile à répartir sur plusieurs machines", "Sensible aux redémarrages du processus"], "right_title": "Stateless (Sans état — REST)", "right_items": ["Chaque requête est 100% autonome", "Scalabilité horizontale immédiate", "Comportement prévisible et testable"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "L'absence d'état en mémoire serveur est le secret de la robustesse et de la scalabilité des APIs REST."}, {"number": 18, "part_id": "P1", "part_title": "Partie 1 — Culture Générale & Jargon des APIs", "tag": "Gouvernance d'API", "title": "Qu'est-ce qu'un Contrat d'API (API Contract) ?", "subtitle": "L'engagement formel et stable qui lie l'équipe Back-end à tous ses consommateurs", "definition": "Le contrat d'API décrit avec exactitude les routes disponibles, les paramètres attendus, la structure des objets JSON, les types de champs et tous les codes d'erreur possibles.", "points": [{"label": "Travail en parallèle", "text": "Front-end et Back-end développent simultanément dès que le contrat est validé ensemble."}, {"label": "Stabilité et versions", "text": "Toute modification cassante exige une nouvelle version explicite comme /api/v2/."}, {"label": "Confiance technique", "text": "Un contrat respecté évite les bogues d'intégration découverts à la dernière minute."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Le code interne peut être réécrit à volonté tant que le contrat public de l'API reste intact."}, {"number": 19, "part_id": "P1", "part_title": "Partie 1 — Culture Générale & Jargon des APIs", "tag": "Documentation Standard", "title": "OpenAPI vs Swagger : Spécification ouverte vs Outils interactifs", "subtitle": "Distinguer la norme officielle de description d'API et les logiciels qui l'exploitent", "definition": "OpenAPI est le standard international YAML ou JSON permettant de décrire formellement un contrat d'API, tandis que Swagger regroupe les outils graphiques qui lisent ce fichier.", "points": [{"label": "Fichier unique", "text": "Un document openapi.yaml décrit routes, schémas JSON, paramètres et sécurité."}, {"label": "Portail interactif", "text": "Swagger UI transforme automatiquement ce fichier en page web testable en direct."}], "comparison": {"left_title": "OpenAPI (La Spécification)", "left_items": ["Norme ouverte Linux Foundation", "Format déclaratif YAML ou JSON", "Indépendant du langage serveur"], "right_title": "Swagger (La Boîte à Outils)", "right_items": ["Swagger Editor pour rédiger le contrat", "Swagger UI pour explorer et tester", "Swagger Codegen pour générer des clients"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "On écrit un contrat selon la norme OpenAPI, puis on l'affiche aux développeurs avec Swagger UI."}, {"number": 20, "part_id": "P1", "part_title": "Partie 1 — Culture Générale & Jargon des APIs", "tag": "Topologie Réseau", "title": "Flux réseau Nord-Sud vs Flux Est-Ouest", "subtitle": "Deux directions de trafic aux contraintes de sécurité et de latence bien distinctes", "definition": "Le trafic Nord-Sud désigne les échanges entre l'extérieur (Internet) et votre système, alors que le trafic Est-Ouest désigne les appels internes entre vos propres serveurs.", "points": [{"label": "Exposition publique", "text": "Un flux Nord-Sud traverse Internet et exige chiffrement TLS, filtrage et limitation de débit."}, {"label": "Performance interne", "text": "Un flux Est-Ouest privilégie la faible latence et la résilience entre services internes."}], "comparison": {"left_title": "Flux Nord-Sud (Externe)", "left_items": ["Client mobile ou web vers Tornado", "Traverse le pare-feu et la Gateway", "Forte exposition aux attaques"], "right_title": "Flux Est-Ouest (Interne)", "right_items": ["Service Catalogue vers Service Paiement", "Reste dans le réseau privé datacenter", "Sensible aux pannes en cascade"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Protégez sévèrement l'entrée Nord-Sud sans jamais négliger la sécurité des échanges Est-Ouest."}, {"number": 21, "part_id": "P1", "part_title": "Partie 1 — Culture Générale & Jargon des APIs", "tag": "Infrastructure Web", "title": "API Gateway & Reverse Proxy : Point d'entrée unique", "subtitle": "Placer un gardien frontal devant vos processus Python Tornado", "definition": "Un Reverse Proxy (comme Nginx) ou une API Gateway reçoit tous les appels externes en première ligne, applique les contrôles transverses et relaie les requêtes saines vers Tornado.", "points": [{"label": "Terminaison TLS", "text": "Gère les certificats HTTPS en amont pour décharger le serveur applicatif Python."}, {"label": "Protection & Quotas", "text": "Applique le rate-limiting, bloque les abus et répartit la charge sur plusieurs instances."}, {"label": "Masquage interne", "text": "Les ports internes Tornado (ex. 8889) ne sont jamais exposés directement sur Internet."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "En production, Tornado travaille derrière un Reverse Proxy qui filtre, chiffre et répartit le trafic."}, {"number": 22, "part_id": "P1", "part_title": "Partie 1 — Culture Générale & Jargon des APIs", "tag": "Posture Sécurité", "title": "Sécurité Zero-Trust : Vérifier systématiquement chaque appel", "subtitle": "Ne jamais supposer qu'une requête est légitime sous prétexte qu'elle vient de l'interne", "definition": "Le modèle Zero-Trust remplace la confiance aveugle liée au réseau local par un principe strict : ne jamais faire confiance par défaut, toujours authentifier et autoriser chaque requête.", "points": [{"label": "Moindre privilège", "text": "Un jeton d'accès ne donne droit qu'aux seules routes et actions strictement nécessaires."}, {"label": "Validation systématique", "text": "Identité, permissions et format des données sont contrôlés à chaque appel HTTP."}], "comparison": {"left_title": "Modèle Château-Fort (Ancien)", "left_items": ["Pare-feu dur à la frontière externe", "Confiance totale une fois à l'intérieur", "Intrusion interne dévastatrice"], "right_title": "Modèle Zero-Trust (Moderne)", "right_items": ["Aucune zone réseau réputée sûre", "Preuve d'identité sur chaque requête", "Cloisonnement strict des impacts"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Chaque endpoint Tornado doit vérifier qui appelle et s'il a le droit d'agir, sans exception."}, {"number": 23, "part_id": "P1", "part_title": "Partie 1 — Culture Générale & Jargon des APIs", "tag": "Identité & Accès", "title": "OAuth 2.0 & OpenID Connect (OIDC) : Délégation d'accès", "subtitle": "Autoriser une application tierce via des jetons temporaires sans livrer son mot de passe", "definition": "OAuth 2.0 est le cadre standard d'autorisation par jeton (Access Token), complété par la surcouche OpenID Connect (OIDC) qui vérifie l'identité de l'utilisateur.", "points": [{"label": "OAuth 2.0 (Autorisation)", "text": "Délivre un Bearer Token à durée limitée précisant les permissions accordées (scopes)."}, {"label": "OIDC (Authentification)", "text": "Ajoute un ID Token signé (souvent JWT) prouvant qui est l'utilisateur connecté."}, {"label": "Sécurité accrue", "text": "L'API Tornado vérifie la validité du jeton sans jamais manipuler le mot de passe maître."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "OAuth 2.0 répond à la question « Que peut-il faire ? » ; OIDC répond à « Qui est-il ? »."}, {"number": 24, "part_id": "P1", "part_title": "Partie 1 — Culture Générale & Jargon des APIs", "tag": "Qualité de Service", "title": "Engagements de fiabilité : SLA, SLO, SLI et Latence (p95 / p99)", "subtitle": "Mesurer objectivement la disponibilité et la vitesse réelle d'une API en production", "definition": "La fiabilité d'une API se pilote par des mesures réelles (SLI), des objectifs internes (SLO) et des engagements contractuels (SLA), en surveillant les centiles de latence plutôt que la moyenne.", "points": [{"label": "SLI -> SLO -> SLA", "text": "Indicateur mesuré (ex. 99,95% dispo), objectif visé (99,9%) et contrat client (99,5%)."}, {"label": "Piège de la moyenne", "text": "Une moyenne de 80 ms peut cacher des clients bloqués pendant 4 secondes."}, {"label": "Latence p95 et p99", "text": "Un p95 à 120 ms garantit que 95% des requêtes répondent en moins de 120 millisecondes."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Jugez toujours la rapidité de votre API sur ses centiles p95 et p99, jamais sur une simple moyenne."}, {"number": 25, "part_id": "P2", "part_title": "Partie 2 — Fondations Python pour les APIs", "tag": "Socle Python", "title": "Variables Python & Stockage en mémoire vive (RAM)", "subtitle": "Comprendre la volatilité des données manipulées dans un processus serveur", "definition": "En Python, une variable est une étiquette pointant vers un objet logé dans la mémoire vive (RAM) du processus Tornado : son accès est ultra-rapide mais disparaît à l'arrêt du serveur.", "points": [{"label": "Typage dynamique", "text": "Le type appartient à la valeur en mémoire, pas au nom de la variable qui la référence."}, {"label": "Volatilité RAM", "text": "Redémarrer le script Python efface instantanément toutes les variables non sauvegardées."}, {"label": "Usage en API", "text": "Idéal pour manipuler une requête en cours ou prototyper avant d'introduire une base SQL."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "La RAM sert au calcul rapide instantané ; seule une base de données assure la survie des données."}, {"number": 26, "part_id": "P2", "part_title": "Partie 2 — Fondations Python pour les APIs", "tag": "Correspondance Types", "title": "Types primitifs Python et équivalents JSON", "subtitle": "La traduction naturelle entre les valeurs internes Python et le format d'échange Web", "definition": "Les cinq types atomiques de Python possèdent une traduction directe et sans perte vers les types standards de la norme JSON lors de l'envoi d'une réponse API.", "points": [{"label": "Texte et Nombres", "text": "Les chaînes str (UTF-8), entiers int et décimaux float passent directement en JSON."}, {"label": "Attention à la casse", "text": "True, False et None prennent une majuscule en Python mais s'écrivent en minuscule en JSON."}], "comparison": {"left_title": "Côté Code Python", "left_items": ["str : \"Management\", int : 3, float : 450.0", "Booléens : True / False", "Absence de valeur : None"], "right_title": "Côté Réponse JSON", "right_items": ["string : \"Management\", number : 3 ou 450.0", "boolean : true / false", "Valeur nulle : null"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Maîtriser le pont exact Python <-> JSON évite les erreurs de typage lors de la sérialisation."}, {"number": 27, "part_id": "P2", "part_title": "Partie 2 — Fondations Python pour les APIs", "tag": "Collections Python", "title": "Les Listes Python [ ] : Collections ordonnées d'éléments", "subtitle": "Représenter une série d'entités comme un catalogue ou des résultats de recherche", "definition": "Une liste Python est une collection ordonnée et modifiable délimitée par des crochets [ ], traduite automatiquement en tableau JSON (Array) dans les réponses d'API.", "points": [{"label": "Indexation dès 0", "text": "Le premier élément se lit à l'indice [0] et le dernier avec l'indice négatif [-1]."}, {"label": "Opérations courantes", "text": "Ajout via .append(), taille via len() et découpage de page par slicing [debut:fin]."}], "comparison": null, "code_label": "Manipulation d'une liste Python", "code_lang": "python", "code": "domaines = [\"Management\", \"Finance\", \"Data\"]\ndomaines.append(\"RH\")\ntotal = len(domaines)        # 4\npremiers = domaines[0:2]     # [\"Management\", \"Finance\"]", "takeaway": "Dès qu'un endpoint retourne zéro, un ou plusieurs éléments, utilisez systématiquement une liste."}, {"number": 28, "part_id": "P2", "part_title": "Partie 2 — Fondations Python pour les APIs", "tag": "Structure Reine", "title": "Les Dictionnaires Python { } : Paires clé-valeur au coeur des APIs", "subtitle": "La structure fondamentale qui modélise chaque ressource JSON dans Tornado", "definition": "Un dictionnaire Python associe des clés uniques (chaînes de caractères) à des valeurs quelconques entre accolades { } : c'est le miroir exact d'un objet JSON.", "points": [{"label": "Accès instantané", "text": "La recherche d'une valeur par sa clé est immédiate quelle que soit la taille du dictionnaire."}, {"label": "Sérialisation native", "text": "Passer un dict à self.write() dans Tornado génère directement une réponse JSON valide."}], "comparison": null, "code_label": "Représenter une formation en dictionnaire", "code_lang": "python", "code": "formation = {\n    \"id\": 101,\n    \"intitule\": \"Architecture des APIs REST\",\n    \"duree_jours\": 5,\n    \"actif\": True,\n}", "takeaway": "En Python Tornado, penser en dictionnaires revient directement à concevoir vos réponses JSON."}, {"number": 29, "part_id": "P2", "part_title": "Partie 2 — Fondations Python pour les APIs", "tag": "Code Défensif", "title": "Lecture sécurisée : d[\"cle\"] vs d.get(\"cle\", defaut)", "subtitle": "Éviter qu'un champ optionnel absent ne provoque un crash KeyError sur le serveur", "definition": "Accéder à une clé absente avec les crochets d[\"cle\"] lève immédiatement une exception KeyError, tandis que la méthode d.get() retourne proprement None ou une valeur de repli.", "points": [{"label": "Crochets stricts", "text": "Réservés aux clés internes dont l'existence est déjà garantie à 100% par votre code."}, {"label": "Méthode .get()", "text": "Indispensable pour lire les payloads JSON envoyés par des clients externes imprévisibles."}], "comparison": null, "code_label": "Accès risqué vs lecture défensive", "code_lang": "python", "code": "payload = {\"intitule\": \"Audit Financier\"}\n# payload[\"domaine\"]  -> Lève KeyError et interrompt le traitement !\ndomaine = payload.get(\"domaine\", \"Général\")\nduree = payload.get(\"duree_jours\", 3)", "takeaway": "Sur toute donnée issue d'une requête cliente, privilégiez toujours .get() avec une valeur par défaut."}, {"number": 30, "part_id": "P2", "part_title": "Partie 2 — Fondations Python pour les APIs", "tag": "Modélisation Métier", "title": "Structures imbriquées : Liste de dictionnaires (Catalogue)", "subtitle": "Assembler listes et dictionnaires pour représenter des collections riches", "definition": "Dans une API réelle, les structures se combinent librement : un catalogue est une liste contenant plusieurs dictionnaires, chacun pouvant lui-même inclure des sous-listes.", "points": [{"label": "Modèle tabulaire", "text": "Une liste de dictionnaires correspond exactement aux lignes d'une future table SQL."}, {"label": "Parcours simple", "text": "Une boucle for ou une compréhension de liste permet de filtrer le catalogue en une ligne."}], "comparison": null, "code_label": "Catalogue de formations en mémoire", "code_lang": "python", "code": "CATALOGUE = [\n    {\"id\": 1, \"code\": \"MGT-10\", \"domaine\": \"Management\", \"jours\": 3},\n    {\"id\": 2, \"code\": \"DAT-20\", \"domaine\": \"Data\", \"jours\": 5},\n]\ndata_only = [f for f in CATALOGUE if f[\"domaine\"] == \"Data\"]", "takeaway": "Une liste de dictionnaires constitue la structure universelle des réponses de collections REST."}, {"number": 31, "part_id": "P2", "part_title": "Partie 2 — Fondations Python pour les APIs", "tag": "Modularité Python", "title": "Fonctions Python (def, return) : Isoler la logique métier", "subtitle": "Ne pas mélanger les calculs métier avec le code réseau HTTP des contrôleurs", "definition": "Une fonction définie avec def encapsule un traitement réutilisable qui reçoit des paramètres en entrée et renvoie un résultat précis via l'instruction return.", "points": [{"label": "Lisibilité", "text": "Les gestionnaires HTTP restent courts et délèguent les calculs à des fonctions claires."}, {"label": "Testabilité", "text": "Une fonction pure se teste instantanément sans même avoir besoin de lancer le serveur."}], "comparison": null, "code_label": "Fonction métier réutilisable", "code_lang": "python", "code": "def trouver_formation(catalogue, formation_id):\n    for item in catalogue:\n        if item[\"id\"] == formation_id:\n            return item\n    return None", "takeaway": "Une bonne fonction fait une seule chose précise, porte un verbe explicite et se teste isolément."}, {"number": 32, "part_id": "P2", "part_title": "Partie 2 — Fondations Python pour les APIs", "tag": "Signatures Propres", "title": "Paramètres par défaut & Arguments nommés", "subtitle": "Rendre les fonctions de filtrage et de pagination souples et auto-documentées", "definition": "Python permet d'attribuer des valeurs par défaut aux paramètres optionnels dans la signature d'une fonction et de les passer par leur nom lors de l'appel.", "points": [{"label": "Valeurs de repli", "text": "Si le client ne précise ni page ni limite, page=1 et limit=10 s'appliquent automatiquement."}, {"label": "Clarté à l'appel", "text": "Écrire paginer(items, page=2, limit=20) élimine toute confusion sur l'ordre des nombres."}, {"label": "Piège classique", "text": "Ne jamais mettre une liste modifiable [] comme défaut ; utiliser None puis initialiser."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Les arguments nommés rendent les appels métier lisibles comme une phrase explicite."}, {"number": 33, "part_id": "P2", "part_title": "Partie 2 — Fondations Python pour les APIs", "tag": "Robustesse Serveur", "title": "Gestion des erreurs avec try / except : Éviter les crashs", "subtitle": "Intercepter proprement les entrées invalides pour répondre un code HTTP maîtrisé", "definition": "Le bloc try / except capture les exceptions prévisibles (JSON malformé, entier invalide) afin que le serveur renvoie une erreur propre au client au lieu d'échouer brutalement.", "points": [{"label": "Cibler l'exception", "text": "Toujours attraper l'erreur précise (ValueError, JSONDecodeError) plutôt qu'un except nu."}, {"label": "Continuité de service", "text": "Une requête fautive d'un client ne doit jamais perturber le serveur ni les autres clients."}], "comparison": null, "code_label": "Conversion sécurisée d'un paramètre", "code_lang": "python", "code": "try:\n    duree = int(payload.get(\"duree_jours\", 0))\nexcept (TypeError, ValueError):\n    self.set_status(400)\n    return self.write({\"erreur\": \"duree_jours doit être un entier\"})", "takeaway": "Interceptez les erreurs de conversion au plus tôt pour traduire l'exception Python en erreur HTTP 400."}, {"number": 34, "part_id": "P2", "part_title": "Partie 2 — Fondations Python pour les APIs", "tag": "Élégance Python", "title": "Les Décorateurs Python (@) : Enrichir une méthode", "subtitle": "Factoriser les contrôles transverses comme l'authentification ou la journalisation", "definition": "Un décorateur placé avec le symbole @ au-dessus d'une fonction ou d'une méthode l'enveloppe automatiquement pour exécuter une vérification avant ou après son appel.", "points": [{"label": "Zéro duplication", "text": "Évite de recopier le code de vérification du jeton d'accès dans vingt endpoints différents."}, {"label": "Usage dans Tornado", "text": "Très utilisé pour protéger les routes sensibles (ex. @require_api_key) avec élégance."}], "comparison": null, "code_label": "Protéger une méthode de RequestHandler", "code_lang": "python", "code": "class FormationAdminHandler(tornado.web.RequestHandler):\n    @verifier_jeton_admin\n    def delete(self, formation_id):\n        supprimer_formation(int(formation_id))\n        self.set_status(204)", "takeaway": "Un décorateur sépare proprement les exigences de sécurité du coeur de la logique métier."}, {"number": 35, "part_id": "P2", "part_title": "Partie 2 — Fondations Python pour les APIs", "tag": "Programmation Objet", "title": "Classes & Héritage : Le modèle RequestHandler de Tornado", "subtitle": "Comment Tornado organise chaque route autour d'une classe spécialisée", "definition": "En Tornado, chaque contrôleur est une classe Python héritant de tornado.web.RequestHandler dont les méthodes nommées get, post, put ou delete répondent aux verbes HTTP.", "points": [{"label": "Héritage utile", "text": "Votre classe récupère immédiatement self.write(), self.render() et self.set_status()."}, {"label": "Classe de base projet", "text": "Créer un BaseHandler intermédiaire permet de partager les réponses d'erreurs communes."}], "comparison": null, "code_label": "Héritage de RequestHandler dans Tornado", "code_lang": "python", "code": "import tornado.web\n\nclass SanteHandler(tornado.web.RequestHandler):\n    def get(self):\n        self.write({\"statut\": \"operationnel\", \"service\": \"ISGP\"})", "takeaway": "Une classe RequestHandler regroupe naturellement toutes les actions HTTP permises sur une même route."}, {"number": 36, "part_id": "P2", "part_title": "Partie 2 — Fondations Python pour les APIs", "tag": "Concurrence Moderne", "title": "Programmation Asynchrone (async def / await)", "subtitle": "Libérer le coeur du serveur pendant les attentes réseau ou disque", "definition": "Déclarer une méthode avec async def et utiliser await devant une opération lente permet à Tornado de traiter d'autres clients pendant l'attente de la réponse externe.", "points": [{"label": "Attente coopérative", "text": "Durant un await, le processus ne dort pas : il bascule instantanément sur une autre requête."}, {"label": "Règle cruciale", "text": "Ne jamais appeler time.sleep() ou une requête bloquante lente dans une méthode async."}], "comparison": null, "code_label": "Méthode asynchrone non-bloquante Tornado", "code_lang": "python", "code": "import asyncio\n\nclass RapportAsyncHandler(tornado.web.RequestHandler):\n    async def get(self):\n        await asyncio.sleep(0.05)  # Simule un appel E/S non-bloquant\n        self.write({\"rapport\": \"pret\"})", "takeaway": "Avec async et await, un seul processus Tornado absorbe une forte charge sans bloquer ses clients."}, {"number": 37, "part_id": "P3", "part_title": "Partie 3 — Réseau, Protocole HTTP/1.1, REST & JSON", "tag": "Fondations Réseau", "title": "La pile réseau d'un appel d'API : DNS, IP, TCP et TLS", "subtitle": "Ce qui se passe réellement sur le réseau avant même le premier octet HTTP", "definition": "Avant d'envoyer une requête HTTP, le client résout le nom de domaine en adresse IP (DNS), ouvre un canal fiable (TCP) et chiffre le tunnel (TLS pour HTTPS).", "points": [{"label": "1. Résolution DNS", "text": "Traduit le nom lisible api.isgp.dz en adresse numérique IP du serveur cible."}, {"label": "2. Poignée de main TCP", "text": "Établit une connexion fiable garantissant l'ordre et l'intégrité des paquets."}, {"label": "3. Chiffrement TLS", "text": "Protège les jetons et le corps JSON contre toute écoute sur le réseau public."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "HTTP voyage toujours à l'intérieur d'une connexion TCP, idéalement chiffrée par TLS (HTTPS)."}, {"number": 38, "part_id": "P3", "part_title": "Partie 3 — Réseau, Protocole HTTP/1.1, REST & JSON", "tag": "Adressage Réseau", "title": "Adresse IP (127.0.0.1 vs 0.0.0.0) et Port TCP (80, 443, 8889)", "subtitle": "Identifier la machine hôte par son IP et le processus Tornado précis par son port", "definition": "L'adresse IP désigne l'interface réseau de la machine, tandis que le numéro de port TCP (de 1 à 65535) dirige le trafic vers le n": null, "code_label": "Trame brute envoyée au serveur Tornado", "code_lang": "http", "code": "POST /api/v1/formations HTTP/1.1\nHost: localhost:8889\nContent-Type: application/json\nAccept: application/json\n\n{\"intitule\": \"Pilotage Stratégique\", \"duree_jours\": 4}", "takeaway": "HTTP/1.1 est un protocole texte lisible : savoir lire une trame brute facilite tout débogage."}, {"number": 42, "part_id": "P3", "part_title": "Partie 3 — Réseau, Protocole HTTP/1.1, REST & JSON", "tag": "Protocole HTTP/1.1", "title": "Anatomie d'une Trame de Réponse HTTP/1.1 brute", "subtitle": "Ce que Python Tornado fabrique et renvoie sur le réseau à la fin du traitement", "definition": "La réponse HTTP reprend exactement la même structure tripartite : une ligne de statut avec son code numérique, des en-têtes descriptifs, une ligne vide puis le payload.", "points": [{"label": "Ligne de statut", "text": "Annonce la version HTTP, le code à trois chiffres (ex. 201) et son libellé standard."}, {"label": "Métadonnées serveur", "text": "Précise le type MIME (application/json) et la longueur exacte en octets (Content-Length)."}], "comparison": null, "code_label": "Trame brute retournée par Tornado", "code_lang": "http", "code": "HTTP/1.1 201 Created\nContent-Type: application/json; charset=UTF-8\nLocation: /api/v1/formations/105\nContent-Length: 58\n\n{\"id\": 105, \"intitule\": \"Pilotage Stratégique\", \"actif\": true}", "takeaway": "Le client lit d'abord le code de statut sur la première ligne avant même d'analyser le corps."}, {"number": 43, "part_id": "P3", "part_title": "Partie 3 — Réseau, Protocole HTTP/1.1, REST & JSON", "tag": "Sémantique HTTP", "title": "Les Méthodes (Verbes) HTTP : GET, POST, PUT, PATCH, DELETE", "subtitle": "Exprimer clairement l'intention métier sans polluer l'URL avec des verbes", "definition": "En REST, une même URL comme /api/v1/formations supporte plusieurs opérations distinctes grâce aux verbes standards du protocole HTTP.", "points": [{"label": "GET & , "subtitle": "Transporter la sécurité, le format et le cache hors du corps métier JSON", "definition": "Les en-têtes HTTP sont des paires Nom: Valeur insensibles à la casse qui encadrent l'échange technique sans mélanger ces informations aux données métier du payload.", "points": [{"label": "Sécurité", "text": "Authorization: Bearer <jeton> transmet la preuve d'identité sur chaque appel protégé."}, {"label": "Format & Taille", "text": "Content-Type et Content-Length guident le décodage exact des octets reçus."}, {"label": "Traçabilité", "text": "X-Request-ID attache un identifiant unique pour suivre un appel dans tous les journaux."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Les données métier vont dans le corps JSON ; le contexte technique et l'identité vont dans les Headers."}, {"number": 46, "part_id": "P3", "part_title": "Partie 3 — Réseau, Protocole HTTP/1.1, REST & JSON", "tag": "Types MIME", "title": "Content-Type vs Accept : Négociation de format", "subtitle": "Distinguer le format de ce que l'on envoie du format que l'on souhaite recevoir", "definition": "Content-Type décrit le type MIME réel du corps présent dans le message courant, tandis qu'Accept indique au serveur quel format le client souhaite obtenir en retour.", "points": [{"label": "Types MIME clés", "text": "application/json (API), text/html (page Web) et application/x-www-form-urlencoded (formulaire)."}, {"label": "Refus propre", "text": "Si le format envoyé est refusé, l'API peut répondre 415 Unsupported Media Type."}], "comparison": null, "code_label": "En-têtes de négociation dans un appel POST", "code_lang": "http", "code": "POST /api/v1/formations HTTP/1.1\nContent-Type: application/json; charset=utf-8\nAccept: application/json", "takeaway": "Content-Type dit « Voici ce que je t'envoie » ; Accept dit « Voici comment réponds-moi »."}, {"number": 47, "part_id": "P3", "part_title": "Partie 3 — Réseau, Protocole HTTP/1.1, REST & JSON", "tag": "Diagnostic title": "Le format JSON (RFC 8259) : Syntaxe et règles strictes", "subtitle": "Éviter les erreurs de syntaxe classiques qui bloquent les parseurs clients", "definition": "JSON (JavaScript Object Notation) est un format texte léger indépendant de tout langage, soumis à des règles grammaticales volontairement rigides pour garantir sa fiabilité.", "points": [{"label": "Guillemets doubles", "text": "Les clés et chaînes utilisent obligatoirement des guillemets doubles \" \", jamais simples."}, {"label": "Zéro virgule finale", "text": "Aucune virgule traînante après le dernier élément ni aucun commentaire ne sont tolérés."}], "comparison": null, "code_label": "Objet JSON strictement conforme RFC 8259", "code_lang": "json", "code": "{\n  \"code\": \"FIN-204\",\n  \"intitule\": \"Contrôle de Gestion\",\n  \"duree_jours\": 4,\n  \"certifiante\": true,\n  \"prerequis\": null\n}", "takeaway": "Un seul guillemet simple ou une virgule en trop rend tout le document JSON invalide (erreur 400)."}, {"number": 52, "part_id": "P3", "part_title": "Partie 3 — Réseau, Protocole HTTP/1.1, REST & JSON", "tag": "Module Standard", "title": "Conversion Python <-> JSON : json.dumps() et json.loads()", "subtitle": "Le module natif Python utilisé pour lire et produire du texte JSON", "definition": "La bibliothèque standard json fournit deux fonctions miroirs : json.loads() lit une chaîne JSON entrante vers un dict Python, et json.dumps() produit une chaîne JSON sortante.", "points": [{"label": "Le « s » signifie string", "text": "loads = load string (désérialiser self.request.body) ; dumps = dump string (sérialiser)."}, {"label": "Accents préservés", "text": "L'option ensure_ascii=False conserve les caractères français lisibles en UTF-8."}], "comparison": null, "code_label": "Décoder et encoder du JSON en Python", "code_lang": "python", "code": "import json\n\ndata = json.loads('{\"code\": \"RH-10\", \"jours\": 2}')\ntexte = json.dumps(data, ensure_ascii=False)\n# data[\"code\"] == \"RH-10\"", "takeaway": "En réception POST/PUT dans Tornado, on décode toujours le corps avec json.loads(self.request.body)."}, {"number": 53, "part_id": "P3", "part_title": "Partie 3 — Réseau, Protocole HTTP/1.1, REST & JSON", "tag": "Qualité REST", "title": "Le Modèle de Maturité de Richardson (Niveaux 0 à 3)", "subtitle": "Évaluer à quel point une API exploite réellement l'architecture REST", "definition": "Proposé par Leonard Richardson, ce modèle classe les APIs Web en quatre paliers progressifs, du simple tunnel HTTP jusqu'au REST complet guidé par hypermédia.", "points": [{"label": "Niveaux 0 & 1", "text": "Niveau 0 : une seule URL fourre-tout ; Niveau 1 : URLs dédiées par ressource (/formations)."}, {"label": "Niveau 2 (Cible pro)", "text": "Combinaison propre des URLs ressources, des verbes HTTP exacts et des vrais codes de statut."}, {"label": "Niveau 3 (HATEOAS)", "text": "Les réponses incluent aussi des liens de navigation dynamiques vers les actions suivantes."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Atteindre rigoureusement le Niveau 2 de Richardson est le standard attendu en entreprise."}, {"number": 54, "part_id": "P3", "part_title": "Partie 3 — Réseau, Protocole HTTP/1.1, REST & JSON", "tag": "Diagnostic Terminal", "title": "Tester une API en terminal avec curl (-i, -X, -H, -d)", "subtitle": "L'outil universel présent sur tout serveur Linux pour vérifier un endpoint", "definition": "La commande curl permet d'émettre n'importe quelle requête HTTP directement depuis un terminal sans navigateur, en contrôlant finement méthode, en-têtes et corps JSON.", "points": [{"label": "Options essentielles", "text": "-i affiche les en-têtes de réponse, -X choisit le verbe, -H ajoute un header, -d envoie le corps."}, {"label": "Réflexe serveur", "text": "Indispensable pour diagnostiquer un serveur distant en SSH où aucune interface graphique n'existe."}], "comparison": null, "code_label": "Tester une création POST avec curl", "code_lang": "bash", "code": "curl -i -X POST http://127.0.0.1:8889/api/v1/formations \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"intitule\": \"Leadership\", \"domaine\": \"Management\", \"duree_jours\": 3}'", "takeaway": "Utilisez toujours l'option curl -i pour inspecter simultanément le code HTTP, les headers et le JSON."}, {"number": 55, "part_id": "P3", "part_title": "Partie 3 — Réseau, Protocole HTTP/1.1, REST & JSON", "tag": "Outillage Développeur", "title": "Outils modernes d'inspection : HTTPie, Postman et fichiers .http", "subtitle": "Gagner en confort pour tester, sauvegarder et partager vos scénarios d'appels", "definition": "Au-delà de curl, des clients dédiés colorisent les réponses JSON, organisent des collections de tests reproductibles et versionnent les exemples d'appels avec le code source.", "points": [{"label": "HTTPie (Terminal)", "text": "Syntaxe concise (http GET :8889/api/v1/formations) avec coloration automatique du JSON."}, {"label": "Clients Graphiques", "text": "Postman, Insomnia ou Bruno gèrent les environnements (local, recette, production) et jetons."}, {"label": "Fichiers .http", "text": "Stockés directement dans le dépôt du projet pour rejouer chaque route en un clic dans l'IDE."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Conservez une collection d'appels de référence dans le projet pour vérifier chaque endpoint en un instant."}, {"number": 56, "part_id": "P3", "part_title": "Partie 3 — Réseau, Protocole HTTP/1.1, REST & JSON", "tag": "Synthèse REST", "title": "Synthèse : Les 6 principes d'une architecture REST propre", "subtitle": "Les règles architecturales formulées par Roy Fielding dans sa thèse fondatrice", "definition": "Une API est véritablement RESTful lorsqu'elle respecte six contraintes complémentaires assurant son découplage, sa performance et sa capacité à passer à l'échelle.", "points": [{"label": "1-2. Client-Serveur & Stateless", "text": "Séparation stricte des responsabilités et absence totale de session client en mémoire."}, {"label": "3-4. Cache & Interface uniforme", "text": "Réponses marquées comme cachables ou non, URLs ressources claires et verbes standards."}, {"label": "5-6. Couches & Code à la demande", "text": "Compatibilité transparente avec les proxys/gateways (et envoi optionnel de scripts)."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Une interface uniforme, sans état et fidèle à HTTP reste lisible dix ans après sa création."}, {"number": 57, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Tornado Core", "title": "Comment fonctionne Tornado ? La boucle non-bloquante IOLoop", "subtitle": "Comprendre pourquoi un unique fil d'exécution peut servir des milliers de clients", "definition": "L'IOLoop de Tornado repose sur une boucle d'événements (Event Loop) qui surveille toutes les connexions ouvertes et traite chaque socket uniquement quand des octets sont prêts.", "points": [{"label": "Zéro attente passive", "text": "Au lieu d'immobiliser un thread par client lent, la boucle passe immédiatement au client suivant."}, {"label": "Intégration asyncio", "text": "Depuis Tornado 6, IOLoop s'appuie nativement sur la boucle standard asyncio de Python."}], "comparison": {"left_title": "Serveur Synchrone Classique", "left_items": ["1 requête = 1 thread dédié bloqué", "Mémoire lourde à grande échelle", "Sature vite si l'E/S externe ralentit"], "right_title": "Boucle IOLoop Tornado", "right_items": ["1 boucle événementielle légère", "Bascule coopérative avec await", "Milliers de connexions simultanées"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Règle cardinale Tornado : ne bloquez jamais l'IOLoop par un calcul lourd ou un appel synchrone lent."}, {"number": 58, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Architecture Tornado", "title": "Les 3 briques de Tornado : RequestHandler, Application, IOLoop", "subtitle": "La trilogie minimale qui compose tout serveur Web ou API Tornado", "definition": "Tout projet Tornado s'articule autour de trois objets complémentaires : les contrôleurs métiers, le registre central des routes et le moteur d'écoute réseau.", "points": [{"label": "1. RequestHandler", "text": "Classe traitant une route précise via ses méthodes get(), post(), put(), patch() ou delete()."}, {"label": "2. Application", "text": "Objet central qui relie chaque expression d'URL à son Handler et porte la configuration."}, {"label": "3. Serveur & Boucle", "text": "app.listen(port) ouvre le socket TCP et la boucle asyncio maintient le serveur en éveil."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "RequestHandler traite l'appel, Application aiguille l'URL, et la boucle événementielle anime le réseau."}, {"number": 59, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Premier Serveur", "title": "Serveur minimal Hello World avec Tornado", "subtitle": "Huit lignes explicites suffisent pour démarrer un serveur HTTP/1.1 complet", "definition": "Sans fichier caché ni configuration opaque, un script Python autonome déclare un RequestHandler, l'attache à la racine \"/\" et écoute sur un port local.", "points": [{"label": "Démarrage propre", "text": "La fonction asynchrone main() ouvre le port 8889 puis attend indéfiniment les requêtes."}, {"label": "Vérification immédiate", "text": "Accessible aussitôt dans le navigateur ou via curl -i http://127.0.0.1:8889/."}], "comparison": null, "code_label": "Serveur Tornado minimal (app.py)", "code_lang": "python", "code": "import asyncio, tornado.web\nclass AccueilHandler(tornado.web.RequestHandler):\n    def get(self):\n        self.write(\"Bonjour depuis Python Tornado !\")\nasync def main():\n    app = tornado.web.Application([(r\"/\", AccueilHandler)])\n    app.listen(8889)\n    await asyncio.Event().wait()", "takeaway": "Avec Tornado, vous voyez exactement où le port s'ouvre et quelle classe répond à quelle URL."}, {"number": 60, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Réponse API JSON", "title": "Générer du JSON automatiquement avec self.write(dict)", "subtitle": "Le raccourci natif de Tornado pour sérialiser proprement vos ressources", "definition": "Lorsqu'on passe un dictionnaire Python à self.write(), Tornado le convertit automatiquement en chaîne JSON UTF-8 et positionne l'en-tête Content-Type: application/json.", "points": [{"label": "Sécurité des listes", "text": "Par sécurité historique, Tornado refuse self.write(liste) directe : enveloppez toujours dans un dict."}, {"label": "Enveloppe propre", "text": "Retourner {\"count\": len(items), \"data\": items} est plus clair et évolutif qu'un tableau nu."}], "comparison": null, "code_label": "Retourner une ressource JSON avec Tornado", "code_lang": "python", "code": "class CatalogueApiHandler(tornado.web.RequestHandler):\n    def get(self):\n        self.set_status(200)\n        self.write({\"service\": \"ISGP\", \"total\": 2, \"data\": CATALOGUE})", "takeaway": "Enveloppez toujours vos listes dans un dictionnaire avant d'appeler self.write()."}, {"number": 61, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Rendu Web HTML", "title": "Servir une page Web HTML avec self.render(\"page.html\")", "subtitle": "Générer des pages dynamiques côté serveur à partir du même catalogue métier", "definition": "La méthode self.render() charge un gabarit HTML depuis le dossier configuré template_path, y injecte les variables Python transmises et renvoie du text/html au navigateur.", "points": [{"label": "Configuration simple", "text": "On déclare template_path=\"templates\" et static_path=\"static\" dans Application."}, {"label": "Variables nommées", "text": "Chaque argument nommé passé à self.render() devient directement utilisable dans le HTML."}], "comparison": null, "code_label": "Rendu d'un template HTML dans Tornado", "code_lang": "python", "code": "class PortailWebHandler(tornado.web.RequestHandler):\n    def get(self):\n        self.render(\"catalogue.html\", titre=\"Formations ISGP\", items=CATALOGUE)", "takeaway": "self.write(dict) parle JSON aux machines ; self.render(...) parle HTML aux visiteurs humains."}, {"number": 62, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Architecture Hybride", "title": "Exposer GET / (Site HTML) et GET /api/... (JSON) ensemble", "subtitle": "Unifier le portail visuel et l'API publique au sein d'une seule Application Tornado", "definition": "Une architecture hybride regroupe dans la même table de routage Tornado les pages HTML destinées aux navigateurs et les endpoints JSON normalisés sous le préfixe /api/v1/.", "points": [{"label": "Déploiement unifié", "text": "Un seul processus à lancer, un seul port réseau à ouvrir et zéro souci initial de CORS."}, {"label": "Socle partagé", "text": "Les deux couches appellent exactement les mêmes fonctions d'accès aux données."}], "comparison": {"left_title": "Routes Web (/, /formations)", "left_items": ["Utilisent self.render(\"...\")", "Content-Type: text/html", "Navigation visuelle pour les apprenants"], "right_title": "Routes API (/api/v1/formations)", "right_items": ["Utilisent self.write({...})", "Content-Type: application/json", "Intégration mobile, JS et partenaires"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Séparez nettement les préfixes d'URL : les pages à la racine, les données pures sous /api/v1/."}, {"number": 63, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Interactivité Client", "title": "Relier le Site Web à l'API avec fetch() en JavaScript", "subtitle": "Rafraîchir dynamiquement le catalogue dans le navigateur sans recharger toute la page", "definition": "Depuis une page HTML servie par Tornado, la fonction standard JavaScript fetch() interroge en arrière-plan l'endpoint JSON /api/v1/formations et met à jour l'écran.", "points": [{"label": "Asynchrone côté navigateur", "text": "await fetch(...) récupère la réponse HTTP puis await res.json() décode le dictionnaire."}, {"label": "Expérience fluide", "text": "Un filtre par domaine actualise instantanément la liste des formations affichées."}], "comparison": null, "code_label": "Appel JavaScript vers l'API Tornado", "code_lang": "html", "code": "<script>\nasync function chargerCatalogue(domaine) {\n  const res = await fetch(\"/api/v1/formations?domaine=\" + encodeURIComponent(domaine));\n  const payload = await res.json();\n  console.log(\"Formations reçues :\", payload.data);\n}\n<\/script>", "takeaway": "Avec fetch(), votre propre page Web devient le tout premier client concret de votre API REST."}, {"number": 64, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Routage Tornado", "title": "Table de routage Application et expressions régulières", "subtitle": "Aiguiller chaque chemin d'URL vers la bonne classe RequestHandler dans l'ordre", "definition": "L'objet tornado.web.Application reçoit une liste ordonnée de couples (motif_regex, ClasseHandler) et sélectionne la première règle qui correspond au chemin demandé.", "points": [{"label": "Ordre prioritaire", "text": "Placez toujours les routes fixes spécifiques avant les motifs génériques plus larges."}, {"label": "Chaînes brutes r\"...\"", "text": "Le préfixe Python r\"\" évite d'avoir à doubler les barres obliques des expressions régulières."}], "comparison": null, "code_label": "Déclaration propre de la table des routes", "code_lang": "python", "code": "def creer_application():\n    return tornado.web.Application([\n        (r\"/\", PortailWebHandler),\n        (r\"/api/v1/sante\", SanteHandler),\n        (r\"/api/v1/formations\", FormationsCollectionHandler),\n    ], template_path=\"templates\", debug=True)", "takeaway": "La table de routage constitue la carte routière lisible de toute votre application Tornado."}, {"number": 65, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Paramètres de Route", "title": "Capturer un identifiant dynamique : r\"/api/v1/formations/([0-9]+)\"", "subtitle": "Extraire proprement un segment d'URL pour cibler une ressource unique", "definition": "En entourant une portion du motif regex avec des parenthèses (...), Tornado extrait automatiquement la valeur capturée et la transmet en argument à get(), put() ou delete().", "points": [{"label": "Filtrage dès l'URL", "text": "Le motif ([0-9]+) accepte uniquement des chiffres : /formations/abc renvoie 404 d'office."}, {"label": "Type chaîne", "text": "L'argument reçu dans def get(self, formation_id) est une str à convertir via int()."}], "comparison": null, "code_label": "Handler d'élément unitaire avec capture d'ID", "code_lang": "python", "code": "# Route : (r\"/api/v1/formations/([0-9]+)\", FormationDetailHandler)\nclass FormationDetailHandler(tornado.web.RequestHandler):\n    def get(self, formation_id):\n        item = trouver_formation(CATALOGUE, int(formation_id))\n        if not item:\n            self.set_status(404)\n            return self.write({\"erreur\": \"Formation introuvable\"})\n        self.write(item)", "takeaway": "Chaque groupe entre parenthèses dans la route devient un paramètre de votre méthode HTTP."}, {"number": 66, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Query Arguments", "title": "Extraire les filtres d'URL avec self.get_query_argument()", "subtitle": "Lire les paramètres optionnels situés après le point d'interrogation", "definition": "La méthode self.get_query_argument(nom, default=...) récupère proprement un paramètre de la Query String en décodant les caractères spéciaux de l'URL.", "points": [{"label": "Défaut explicite", "text": "Fournir default=None ou default=\"\" évite l'erreur HTTP 400 Missing argument si le filtre est omis."}, {"label": "Valeurs multiples", "text": "self.get_query_arguments(\"tag\") au pluriel retourne une liste si la clé est répétée."}], "comparison": null, "code_label": "Lecture de filtres optionnels dans GET", "code_lang": "python", "code": "class FormationsCollectionHandler(tornado.web.RequestHandler):\n    def get(self):\n        domaine = self.get_query_argument(\"domaine\", default=None)\n        q = self.get_query_argument(\"q\", default=\"\").strip()\n        self.write({\"filtre_domaine\": domaine, \"recherche\": q})", "takeaway": "Précisez toujours default=... sur get_query_argument() pour garder vos filtres facultatifs."}, {"number": 67, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Inspection Requête", "title": "L'objet self.request : Méthode, en-têtes, IP et corps brut", "subtitle": "Accéder à toutes les métadonnées bas niveau du message HTTP entrant", "definition": "À l'intérieur de tout RequestHandler, l'attribut self.request expose l'objet HTTPServerRequest contenant l'intégralité des détails réseaux et protocolaires de l'appel.", "points": [{"label": "Headers & Auth", "text": "self.request.headers.get(\"Authorization\") lit un en-tête de façon insensible à la casse."}, {"label": "Corps brut bytes", "text": "self.request.body contient les octets reçus à passer à json.loads() lors d'un POST/PUT."}], "comparison": null, "code_label": "Inspecter le contexte d'un appel entrant", "code_lang": "python", "code": "methode = self.request.method                        # \"POST\"\nip_client = self.request.remote_ip                   # \"127.0.0.1\"\nctype = self.request.headers.get(\"Content-Type\", \"\") # \"application/json\"\npayload = json.loads(self.request.body.decode(\"utf-8\"))", "takeaway": "self.request vous donne une visibilité totale sur les en-têtes, l'origine client et les octets reçus."}, {"number": 68, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Templates Tornado", "title": "Le moteur tornado.template : {{ var }}, {% for %} et sécurité XSS", "subtitle": "Composer des pages HTML dynamiques rapides et protégées par défaut", "definition": "Intégré sans dépendance externe, tornado.template évalue les expressions entre doubles accolades {{ }} et les structures de contrôle Python entre {% %}...{% end %}.", "points": [{"label": "Fermeture explicite", "text": "En Tornado, tout bloc {% if ... %} ou {% for ... %} se ferme toujours par {% end %}."}, {"label": "Anti-XSS natif", "text": "Les caractères HTML dangereux (<script>) dans {{ var }} sont échappés automatiquement."}], "comparison": null, "code_label": "Extrait de template HTML Tornado", "code_lang": "html", "code": "<h1>{{ titre }}<\/h1>\n<ul>\n  {% for f in items %}\n    <li><strong>{{ f[\"code\"] }}<\/strong> — {{ f[\"intitule\"] }} ({{ f[\"jours\"] }} j)<\/li>\n  {% end %}\n<\/ul>", "takeaway": "L'auto-échappement natif de tornado.template protège vos pages contre les injections XSS."}, {"number": 69, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Formulaires Web", "title": "Traiter un formulaire HTML : get_body_argument() et statut 303", "subtitle": "Appliquer le patron classique Post / Redirect / Get sur le volet Site Web", "definition": "Lorsqu'un visiteur soumet un formulaire HTML <form method=\"post\">, Tornado lit les champs avec self.get_body_argument() puis redirige le navigateur en statut 303 See Other.", "points": [{"label": "Éviter le double envoi", "text": "La redirection self.redirect(\"/formations\", status=303) empêche de recréer l'entrée avec F5."}, {"label": "Différence avec JSON", "text": "Un formulaire HTML envoie du x-www-form-urlencoded ; une API reçoit du application/json."}], "comparison": null, "code_label": "Réception de formulaire Web et redirection PRG", "code_lang": "python", "code": "class FormulaireFormationHandler(tornado.web.RequestHandler):\n    def post(self):\n        intitule = self.get_body_argument(\"intitule\").strip()\n        jours = int(self.get_body_argument(\"duree_jours\", default=\"3\"))\n        ajouter_au_catalogue(intitule=intitule, jours=jours)\n        self.redirect(\"/formations\", status=303)", "takeaway": "Après un POST issu d'un formulaire HTML, redirigez toujours en 303 vers une page GET propre."}, {"number": 70, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Recherche Catalogue", "title": "Filtrage, Recherche et Tri dynamique d'un catalogue", "subtitle": "Enchaîner un pipeline de sélection propre avant de renvoyer la collection", "definition": "Un endpoint de collection professionnel combine successivement le filtrage exact, la recherche textuelle insensible à la casse et le tri contrôlé sur liste blanche.", "points": [{"label": "1. Filtrer & Chercher", "text": "Réduire d'abord la collection par domaine exact puis par mot-clé dans l'intitulé."}, {"label": "2. Trier sur liste blanche", "text": "Autoriser uniquement des clés de tri connues (jours, tarif, intitule) pour éviter toute erreur."}, {"label": "3. Paginer en dernier", "text": "La découpe en pages s'applique toujours à la toute fin, après filtrage et tri."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Ordre immuable d'une collection API : 1. Filtrer -> 2. Trier -> 3. Calculer le total -> 4. Paginer."}, {"number": 71, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Pagination REST", "title": "Pagination d'une collection : page, limit et enveloppe meta/data", "subtitle": "Protéger le réseau et le navigateur quand le catalogue contient des milliers de lignes", "definition": "La pagination découpe les résultats en tranches bornées via page (>= 1) et limit (plafonné, ex. max 100) tout en fournissant les compteurs de navigation dans meta.", "points": [{"label": "Formule d'offset", "text": "Le point de départ dans la liste ou en SQL vaut toujours offset = (page - 1) * limit."}, {"label": "Plafond de sécurité", "text": "Bornez toujours limit côté serveur (ex. min(limit, 100)) contre les requêtes abusives."}], "comparison": null, "code_label": "Enveloppe JSON standardisée d'une liste paginée", "code_lang": "json", "code": "{\n  \"meta\": {\"page\": 2, \"limit\": 10, \"total\": 47, \"pages\": 5},\n  \"data\": [\n    {\"id\": 11, \"code\": \"MGT-21\", \"intitule\": \"Gestion de Projet\"}\n  ]\n}", "takeaway": "Ne renvoyez jamais une collection non bornée : paginez dès la première version de l'API."}, {"number": 72, "part_id": "P4", "part_title": "Partie 4 — Coeur de Tornado : IOLoop, RequestHandler & Templates Web", "tag": "Cycle de Vie", "title": "Cycle de vie dans RequestHandler : prepare, verbe HTTP, on_finish", "subtitle": "Les crochets d'exécution automatiques appelés par Tornado autour de chaque requête", "definition": "Pour chaque appel entrant, Tornado instancie un RequestHandler neuf et exécute dans un ordre précis ses méthodes de cycle de vie avant et après votre méthode métier.", "points": [{"label": "set_default_headers()", "text": "Appelé dès l'initialisation pour poser les en-têtes communs (CORS, sécurité, JSON)."}, {"label": "prepare() avant le verbe", "text": "Idéal pour décoder le JSON, démarrer un chronomètre ou vérifier un jeton d'accès."}, {"label": "on_finish() en clôture", "text": "Exécuté après l'envoi de la réponse au client pour journaliser la durée ou libérer une ressource."}], "comparison": null, "code_label": "Séquence complète d'un BaseHandler Tornado", "code_lang": "python", "code": "class BaseApiHandler(tornado.web.RequestHandler):\n    def set_default_headers(self):\n        self.set_header(\"X-Content-Type-Options\", \"nosniff\")\n    def prepare(self):\n        self.t0 = time.perf_counter()\n    def on_finish(self):\n        duree_ms = (time.perf_counter() - self.t0) * 1000", "takeaway": "Factorisez vos contrôles communs dans prepare() et vos journaux de performance dans on_finish()."}, {"number": 73, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Cycle CRUD", "title": "Le cycle CRUD complet et sa correspondance HTTP", "subtitle": "Aligner chaque opération métier sur la sémantique native du protocole HTTP.", "definition": "CRUD désigne les quatre opérations fondamentales sur une ressource persistante : créer, lire, modifier et supprimer via des méthodes HTTP normalisées.", "points": [{"label": "POST (Create)", "text": "Crée une nouvelle ressource dans la collection et génère son identifiant serveur."}, {"label": "GET (Read)", "text": "Consulte une collection ou une fiche détail sans jamais altérer l'état du serveur."}, {"label": "PUT / PATCH (Update)", "text": "Remplace intégralement ou met à jour partiellement une ressource existante."}, {"label": "DELETE (Delete)", "text": "Retire la ressource ciblée de manière définitive ou par archivage logique."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Une API prévisible utilise les verbes HTTP pour l'action et les URL uniquement pour désigner la ressource."}, {"number": 74, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Parsing JSON", "title": "Décoder un corps JSON entrant avec json_decode", "subtitle": "Transformer les octets bruts de self.request.body en dictionnaire Python.", "definition": "Tornado ne décode pas automatiquement le corps JSON entrant : le handler lit les octets bruts puis appelle tornado.escape.json_decode dans un bloc protégé.", "points": [{"label": "Octets bruts", "text": "self.request.body contient une chaîne d'octets reçue
