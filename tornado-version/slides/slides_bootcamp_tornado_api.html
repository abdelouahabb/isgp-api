 sur la socket HTTP."}, {"label": "Capture d'erreur", "text": "Un JSON tronqué lève ValueError qu'il faut convertir proprement en statut 400."}, {"label": "Vérification du type", "text": "Toujours vérifier que la racine décodée est bien un objet dict et non une liste."}], "comparison": null, "code_label": "Décodage défensif dans un RequestHandler", "code_lang": "python", "code": "from tornado.escape import json_decode\n\ntry:\n    payload = json_decode(self.request.body or b\"{}\")\n    if not isinstance(payload, dict):\n        raise ValueError(\"Objet JSON attendu\")\nexcept ValueError:\n    return self.envoyer_probleme(400, \"Corps JSON mal formé\")", "takeaway": "Ne faites jamais confiance à self.request.body sans intercepter explicitement les erreurs de syntaxe JSON."}, {"number": 75, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Validation Serveur", "title": "Pourquoi valider systématiquement les entrées côté serveur ?", "subtitle": "Le navigateur est un client parmi d'autres et ses contrôles se contournent.", "definition": "La validation serveur est le contrôle obligatoire des types, formats et bornes métiers exécuté par l'API avant tout traitement ou écriture en base.", "points": [{"label": "Contournement trivial", "text": "Un appel curl ou un script Python ignore totalement les attributs HTML required."}, {"label": "Intégrité des données", "text": "Bloquer un prix négatif ou un titre vide protège durablement la base relationnelle."}, {"label": "Surface d'attaque", "text": "Borner la taille des chaînes et des tableaux évite la saturation mémoire du processus."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "La validation côté client sert le confort utilisateur ; seule la validation côté serveur garantit la sécurité."}, {"number": 76, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Codes d'Erreur", "title": "400 Bad Request vs 422 Unprocessable Entity", "subtitle": "Distinguer une erreur d'enveloppe technique d'un rejet de règle métier.", "definition": "Le code 400 signale une requête techniquement illisible par le parseur, tandis que le code 422 indique un JSON syntaxiquement valide mais contraire aux règles métier.", "points": [{"label": "Diagnostic immédiat", "text": "Le développeur client sait instantanément s'il a cassé son sérialiseur ou violé une règle."}, {"label": "Détails par champ", "text": "Une réponse 422 liste précisément chaque champ invalide pour éclairer le formulaire."}], "comparison": {"left_title": "400 Bad Request (Syntaxe)", "left_items": ["Accolade manquante ou JSON tronqué", "En-tête Content-Type incohérent", "Paramètre d'URL illisible"], "right_title": "422 Unprocessable Entity (Métier)", "right_items": ["JSON bien formé et lisible", "Prix inférieur ou égal à zéro", "Code catégorie hors nomenclature"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "400 signifie je ne peux pas lire votre message ; 422 signifie j'ai lu votre message mais ses valeurs sont invalides."}, {"number": 77, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Standard RFC 7807", "title": "Le standard RFC 7807 : Structure d'erreur normalisée", "subtitle": "Unifier toutes les erreurs d'API sous le type MIME application/problem+json.", "definition": "La RFC 7807 définit une enveloppe JSON universelle dite Problem Details permettant aux clients de traiter toutes les erreurs HTTP avec un seul modèle.", "points": [{"label": "Champs standards", "text": "type, title, status, detail et instance constituent le socle interopérable."}, {"label": "Extensions métiers", "text": "Un tableau errors peut détailler chaque champ fautif lors d'une validation 422."}, {"label": "Type MIME dédié", "text": "L'en-tête Content-Type vaut application/problem+json; charset=utf-8."}], "comparison": null, "code_label": "Réponse 422 conforme RFC 7807", "code_lang": "json", "code": "{\n  \"type\": \"https://api.isgp.dz/erreurs/validation\",\n  \"title\": \"Données métier invalides\",\n  \"status\": 422,\n  \"detail\": \"Le champ prix_dzd doit être strictement positif.\",\n  \"errors\": [{\"champ\": \"prix_dzd\", \"message\": \"Doit être > 0\"}]\n}", "takeaway": "Adopter RFC 7807 élimine les formats d'erreur disparates et simplifie l'intégration côté client."}, {"number": 78, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Création REST", "title": "Création POST : Statut 201 Created et en-tête Location", "subtitle": "Confirmer la naissance d'une ressource et indiquer son adresse canonique.", "definition": "Lorsqu'un appel POST crée effectivement une ressource, le serveur renvoie le code 201 Created accompagné de l'en-tête Location pointant vers sa fiche.", "points": [{"label": "Statut explicite", "text": "201 Created distingue une création effective d'un simple traitement 200 OK."}, {"label": "Navigation directe", "text": "L'en-tête Location donne l'URI exacte de la nouvelle ressource sans supposition."}, {"label": "Corps représentatif", "text": "Retourner l'objet créé inclut l'identifiant et les horodatages générés par le serveur."}], "comparison": null, "code_label": "Réponse POST conforme dans Tornado", "code_lang": "python", "code": "article = depot.creer_formation(donnees_validees)\nself.set_status(201)\nself.set_header(\"Location\", f\"/api/formations/{article['id']}\")\nself.write({\"donnees\": article})", "takeaway": "Un POST créateur réussi associe systématiquement 201 Created, en-tête Location et représentation JSON."}, {"number": 79, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Mise à Jour", "title": "PUT (Remplacement intégral) vs PATCH (Modification partielle)", "subtitle": "Choisir la bonne sémantique de mise à jour selon le contrat attendu.", "definition": "PUT remplace toute la représentation d'une ressource cible, tandis que PATCH applique uniquement un sous-ensemble de modifications sur les champs fournis.", "points": [{"label": "Risque d'écrasement", "text": "Un champ omis dans un PUT est réinitialisé ou rejeté, jamais ignoré silencieusement."}, {"label": "Souplesse ergonomique", "text": "PATCH convient idéalement pour changer uniquement le statut ou le tarif d'une fiche."}], "comparison": {"left_title": "PUT — Remplacement complet", "left_items": ["Exige tous les champs obligatoires", "Naturellement idempotent", "Écrase l'état précédent de la fiche"], "right_title": "PATCH — Modification partielle", "right_items": ["N'envoie que les champs modifiés", "Économise la bande passante", "Préserve les attributs non transmis"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Utilisez PUT pour synchroniser une fiche entière et PATCH pour modifier un ou deux attributs ciblés."}, {"number": 80, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Suppression REST", "title": "Suppression DELETE propre et statut 204 No Content", "subtitle": "Acquitter une suppression réussie sans charge utile superflue.", "definition": "Une suppression HTTP réussie qui ne nécessite aucun corps de réponse renvoie le statut 204 No Content et clôture immédiatement le flux avec self.finish().", "points": [{"label": "Zéro octet au corps", "text": "La norme HTTP interdit tout contenu dans le corps d'une réponse 204 No Content."}, {"label": "Ressource introuvable", "text": "Si l'identifiant n'existe pas, renvoyer un problème 404 explicite au format RFC 7807."}, {"label": "Clôture nette", "text": "Appeler self.finish() sans argument garantit l'absence d'enveloppe JSON parasite."}], "comparison": null, "code_label": "Méthode delete() idiomatique Tornado", "code_lang": "python", "code": "def delete(self, formation_id: str) -> None:\n    supprime = depot.supprimer(int(formation_id))\n    if not supprime:\n        return self.envoyer_probleme(404, \"Formation introuvable\")\n    self.set_status(204)\n    self.finish()", "takeaway": "Avec 204 No Content, n'appelez jamais self.write() : posez le statut puis appelez directement self.finish()."}, {"number": 81, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Fiabilité Réseau", "title": "Garantir l'idempotence d'un POST avec Idempotency-Key", "subtitle": "Éviter les doublons de création ou de paiement lors des coupures réseau.", "definition": "Une clé d'idempotence est un identifiant unique généré par le client dans l'en-tête Idempotency-Key permettant au serveur de rejouer la même réponse sans recréer l'objet.", "points": [{"label": "Problème du retry", "text": "Sur un timeout mobile, le client ignore si le serveur a déjà enregistré son POST."}, {"label": "Mémorisation serveur", "text": "L'API associe la clé reçue au statut et au corps JSON produits lors du premier essai."}, {"label": "Rejeu sans doublon", "text": "Tout essai ultérieur portant la même clé reçoit exactement la réponse initiale."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Toute opération critique non idempotente comme une inscription payante doit accepter un Idempotency-Key."}, {"number": 82, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Gestion d'Erreurs", "title": "Harmoniser toutes les erreurs Tornado via write_error()", "subtitle": "Bannir les pages d'erreur HTML par défaut dans un serveur d'API JSON.", "definition": "Surcharger write_error dans un RequestHandler de base intercepte toutes les exceptions HTTP et techniques pour émettre systématiquement du JSON RFC 7807.", "points": [{"label": "Classe socle BaseAPIHandler", "text": "Tous les endpoints héritent d'un handler commun qui centralise le formatage d'erreur."}, {"label": "Masquage en production", "text": "Sur une erreur 500, journaliser la trace en interne mais exposer un message neutre."}, {"label": "Cohérence garantie", "text": "Même un HTTPError(405) natif de Tornado ressort désormais en application/problem+json."}], "comparison": null, "code_label": "Surcharge de write_error dans BaseAPIHandler", "code_lang": "python", "code": "def write_error(self, status_code: int, **kwargs) -> None:\n    self.set_header(\"Content-Type\", \"application/problem+json; charset=utf-8\")\n    self.finish({\n        \"type\": \"about:blank\",\n        \"title\": self._reason,\n        \"status\": status_code,\n    })", "takeaway": "Un client JSON ne doit jamais recevoir de page HTML d'erreur, même en cas de crash interne 500."}, {"number": 83, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Routage Défensif", "title": "Intercepter les routes inconnues avec default_handler_class", "subtitle": "Capturer les URL inexistantes avant que Tornado ne réponde en HTML brut.", "definition": "Le paramètre default_handler_class de tornado.web.Application désigne le handler de repli exécuté lorsqu'aucune expression régulière de route ne correspond.", "points": [{"label": "Angle mort classique", "text": "Sans configuration, une URL inconnue contourne vos handlers métiers et renvoie du HTML."}, {"label": "Préparation dans prepare()", "text": "Lever HTTPError(404) dans prepare() déclenche immédiatement votre write_error JSON."}], "comparison": null, "code_label": "Configuration du handler 404 global", "code_lang": "python", "code": "class RouteInconnueHandler(BaseAPIHandler):\n    def prepare(self) -> None:\n        raise tornado.web.HTTPError(404, reason=\"Route introuvable\")\n\napp = tornado.web.Application(routes, default_handler_class=RouteInconnueHandler)", "takeaway": "Configurez toujours default_handler_class pour garantir un 404 JSON uniforme sur tout le serveur."}, {"number": 84, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Persistance", "title": "Stockage en mémoire vive (RAM) vs SQLite sur disque", "subtitle": "Comprendre pourquoi un dictionnaire Python ne suffit plus au-delà du prototype.", "definition": "Une liste Python en mémoire disparaît à chaque redémarrage du processus, alors que SQLite persiste les tables relationnelles dans un fichier transactionnel sur disque.", "points": [{"label": "Zéro serveur tiers", "text": "SQLite s'embarque directement via le module standard sqlite3 sans démon externe."}, {"label": "Multi-processus", "text": "Un fichier SQLite partagé survit aux déploiements et fédère plusieurs workers locaux."}], "comparison": {"left_title": "Mémoire vive (dict / list)", "left_items": ["Ultra-rapide pour maquetter", "Perte totale au redémarrage", "Isolée dans un seul processus"], "right_title": "Base SQLite sur disque", "right_items": ["Données durables après arrêt", "Contraintes SQL et index rapides", "Transactions atomiques complètes"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "La mémoire vive valide le contrat HTTP ; SQLite apporte la durabilité indispensable à une vraie application."}, {"number": 85, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Transactions SQL", "title": "Les 4 garanties ACID d'une transaction relationnelle", "subtitle": "Protéger la cohérence métier même en cas de panne électrique ou d'accès concurrent.", "definition": "ACID résume les quatre propriétés fondamentales d'une transaction fiable : Atomicité, Cohérence, Isolation et Durabilité des écritures validées.", "points": [{"label": "Atomicité (Tout ou rien)", "text": "Si une étape échoue, toute la transaction est annulée par rollback sans trace partielle."}, {"label": "Cohérence (Contraintes)", "text": "Aucune écriture ne peut violer les clés étrangères ou les règles CHECK du schéma."}, {"label": "Isolation (Concurrence)", "text": "Deux requêtes simultanées ne lisent jamais un état intermédiaire incohérent."}, {"label": "Durabilité (Disque)", "text": "Une fois le commit confirmé, la donnée survit à un arrêt brutal du serveur."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Encapsulez toujours les écritures liées dans un bloc transactionnel with conn: pour bénéficier d'ACID."}, {"number": 86, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Sécurité SQL", "title": "Injection SQL : Concaténation vs Requêtes paramétrées", "subtitle": "Séparer strictement l'arbre syntaxique SQL des valeurs fournies par l'utilisateur.", "definition": "L'injection SQL survient lorsqu'une entrée externe est concaténée dans une requête texte, permettant à un attaquant d'altérer la commande exécutée par le moteur.", "points": [{"label": "Interdiction des f-strings", "text": "Ne jamais interpoler une variable utilisateur dans une chaîne SELECT, INSERT ou WHERE."}, {"label": "Marqueurs ? sécurisés", "text": "Le pilote sqlite3 lie les paramètres sous forme de valeurs pures jamais interprétées comme du code."}], "comparison": {"left_title": "Concaténation vulnérable", "left_items": ["f\"SELECT * FROM users WHERE nom='{x}'\"", "Altérable par ' OR '1'='1", "Risque d'exfiltration ou destruction"], "right_title": "Requête paramétrée sûre", "right_items": ["cur.execute('... WHERE nom = ?', (x,))", "Plan SQL compilé séparément", "Immunité totale contre l'injection"]}, "code_label": "Requête paramétrée avec sqlite3", "code_lang": "python", "code": "curseur.execute(\n    \"SELECT id, titre, prix_dzd FROM formations WHERE categorie = ? AND prix_dzd <= ?\",\n    (categorie, budget_max),\n)", "takeaway": "Zéro f-string dans vos requêtes SQL : utilisez exclusivement les marqueurs paramétrés ? avec un tuple."}, {"number": 87, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "SQLite WAL", "title": "Optimiser SQLite pour le Web : WAL, foreign_keys et busy_timeout", "subtitle": "Trois directives PRAGMA essentielles dès l'ouverture de chaque connexion.", "definition": "Le mode Write-Ahead Logging (WAL) écrit les modifications dans un journal séquentiel séparé afin que les lectures HTTP ne soient plus bloquées par une écriture.", "points": [{"label": "journal_mode = WAL", "text": "Autorise plusieurs lecteurs simultanés pendant qu'une transaction écrit sur le disque."}, {"label": "foreign_keys = ON", "text": "Active la vérification stricte des clés étrangères, désactivée par défaut dans SQLite."}, {"label": "busy_timeout = 5000", "text": "Attend jusqu'à 5 secondes qu'un verrou se libère au lieu d'échouer immédiatement."}], "comparison": null, "code_label": "Initialisation recommandée d'une connexion SQLite", "code_lang": "sql", "code": "PRAGMA journal_mode = WAL;\nPRAGMA synchronous = NORMAL;\nPRAGMA foreign_keys = ON;\nPRAGMA busy_timeout = 5000;", "takeaway": "Sans mode WAL ni busy_timeout, SQLite lève rapidement database is locked sous trafic HTTP concurrent."}, {"number": 88, "part_id": "P5", "part_title": "Partie 5 — Ingénierie CRUD, Validation RFC 7807 & SQLite WAL", "tag": "Asynchronisme & Disque", "title": "Ne jamais bloquer l'IOLoop : SQLite via run_in_executor", "subtitle": "Déporter les appels synchrones sqlite3 vers un ThreadPoolExecutor dédié.", "definition": "Le module standard sqlite3 effectue des entrées-sorties disque synchrones : l'appeler via IOLoop.current().run_in_executor garde la boucle événementielle Tornado libre.", "points": [{"label": "Boucle mono-thread", "text": "Une requête SQL lente exécutée en direct gèle toutes les autres connexions actives."}, {"label": "Pool borné", "text": "Un ThreadPoolExecutor de 4 threads absorbe les accès disque tout en maîtrisant les verrous."}, {"label": "Syntaxe await fluide", "text": "Le handler reste écrit avec async def et attend proprement le résultat du thread."}], "comparison": null, "code_label": "Exécution non bloquante dans un handler Tornado", "code_lang": "python", "code": "from tornado.ioloop import IOLoop\n\nclass FormationsHandler(BaseAPIHandler):\n    async def get(self) -> None:\n        boucle = IOLoop.current()\n        lignes = await boucle.run_in_executor(self.pool, depot.lister_tout)\n        self.write({\"donnees\": lignes})", "takeaway": "Toute opération disque synchrone dans Tornado doit passer par run_in_executor pour préserver la réactivité."}, {"number": 89, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Fondamentaux Sécurité", "title": "Les 3 piliers : Confidentialité, Intégrité, Disponibilité", "subtitle": "Évaluer chaque mécanisme défensif d'une API selon le modèle CIA.", "definition": "La sécurité d'une API repose sur trois garanties complémentaires : protéger le secret des données, empêcher leur falsification et maintenir le service accessible.", "points": [{"label": "Confidentialité", "text": "Seuls les acteurs autorisés lisent les données sensibles grâce à TLS et au contrôle d'accès."}, {"label": "Intégrité", "text": "Aucune donnée ou signature ne peut être modifiée en transit sans détection immédiate."}, {"label": "Disponibilité", "text": "Les quotas, timeouts et limites protègent le serveur contre la saturation volontaire ou non."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Un contrôle de sécurité pertinent protège toujours explicitement la confidentialité, l'intégrité ou la disponibilité."}, {"number": 90, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Hygiène des Secrets", "title": "Gestion des secrets applicatifs avec os.environ", "subtitle": "Zéro clé secrète ni mot de passe en dur dans le dépôt de code source.", "definition": "Un secret applicatif est une valeur sensible injectée au démarrage via l'environnement du système d'exploitation plutôt qu'écrite dans les fichiers Python.", "points": [{"label": "Séparation stricte", "text": "Le même code tourne en développement et en production avec des secrets distincts."}, {"label": "Échec immédiat", "text": "Refuser de démarrer le serveur si une clé critique manque évite tout mode dégradé."}, {"label": "Rotation simple", "text": "Changer une clé compromise ne demande qu'un redémarrage sans modifier le code."}], "comparison": null, "code_label": "Lecture stricte d'un secret au démarrage", "code_lang": "python", "code": "import os\n\nCOOKIE_SECRET = os.environ.get(\"ISGP_COOKIE_SECRET\")\nif not COOKIE_SECRET or len(COOKIE_SECRET) < 32:\n    raise RuntimeError(\"Variable ISGP_COOKIE_SECRET absente ou trop courte\")", "takeaway": "Un secret commité dans l'historique du code doit être considéré comme compromis et révoqué aussitôt."}, {"number": 91, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Cryptographie", "title": "Chiffrement (Réversible) vs Hachage (Irréversible)", "subtitle": "Ne jamais confondre la protection d'un message lisible et l'empreinte d'un secret.", "definition": "Le chiffrement transforme une donnée pour pouvoir la relire avec une clé, tandis que le hachage produit une empreinte à sens unique impossible à inverser.", "points": [{"label": "Effet avalanche", "text": "Modifier un seul caractère d'entrée change radicalement toute l'empreinte hachée."}, {"label": "Usage distinct", "text": "On chiffre un numéro confidentiel à réafficher, mais on hache toujours un mot de passe."}], "comparison": {"left_title": "Chiffrement (AES, TLS)", "left_items": ["Opération bidirectionnelle", "Nécessite une clé de déchiffrement", "Adapté au transport et aux archives"], "right_title": "Hachage (SHA-256, PBKDF2)", "right_items": ["Opération strictement à sens unique", "Vérification par recalcul d'empreinte", "Obligatoire pour les mots de passe"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Si votre base est volée, un mot de passe haché avec sel reste illisible sans clé de déchiffrement."}, {"number": 92, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Mots de Passe", "title": "Protéger les mots de passe : Sel aléatoire et PBKDF2", "subtitle": "Rendre les dictionnaires précalculés et la force brute impraticables.", "definition": "PBKDF2-HMAC-SHA256 combine chaque mot de passe avec un sel aléatoire unique et répète des centaines de milliers d'itérations pour ralentir tout attaquant.", "points": [{"label": "Sel unique (Salt)", "text": "Deux utilisateurs ayant le même mot de passe obtiennent deux empreintes totalement différentes."}, {"label": "Lenteur volontaire", "text": "600 000 itérations coûtent quelques millisecondes au login mais ruinent la force brute."}, {"label": "Bibliothèque standard", "text": "hashlib.pbkdf2_hmac et secrets.token_bytes suffisent sans dépendance externe."}], "comparison": null, "code_label": "Dérivation sécurisée avec hashlib et secrets", "code_lang": "python", "code": "import hashlib, secrets\n\nsel = secrets.token_bytes(16)\nempreinte = hashlib.pbkdf2_hmac(\n    \"sha256\", mot_de_passe.encode(\"utf-8\"), sel, 600_000\n)", "takeaway": "Un simple SHA-256 rapide ne suffit pas pour un mot de passe : exigez toujours un sel unique et PBKDF2."}, {"number": 93, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Accès Machine", "title": "Authentification par Clé API (X-API-Key)", "subtitle": "Identifier simplement un script automatisé ou un serveur partenaire.", "definition": "Une clé API est un secret long à haute entropie transmis dans un en-tête dédié comme X-API-Key pour authentifier une intégration serveur à serveur.", "points": [{"label": "Génération robuste", "text": "Créer les clés avec secrets.token_urlsafe(32) garantit une entropie cryptographique."}, {"label": "Jamais dans l'URL", "text": "Passer la clé en paramètre ?api_key= l'expose en clair dans tous les journaux HTTP."}, {"label": "Stockage haché", "text": "Le serveur ne conserve en base que l'empreinte SHA-256 de la clé et son préfixe d'audit."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Réservez X-API-Key aux échanges entre serveurs ; ne l'embarquez jamais dans le JavaScript public d'un navigateur."}, {"number": 94, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Canaux Cachés", "title": "Attaque temporelle et hmac.compare_digest()", "subtitle": "Comparer deux secrets en temps constant pour ne divulguer aucun indice.", "definition": "L'opérateur Python == s'arrête dès le premier octet différent, permettant à un attaquant patient de deviner un secret caractère par caractère en mesurant le temps.", "points": [{"label": "Fuite microseconde", "text": "Plus un préfixe soumis est exact, plus la comparaison naïve met légèrement de temps."}, {"label": "Temps constant", "text": "hmac.compare_digest parcourt tous les octets quelle que soit la position de l'écart."}], "comparison": null, "code_label": "Vérification de clé ou signature en temps constant", "code_lang": "python", "code": "import hmac\n\ncle_recue = self.request.headers.get(\"X-API-Key\", \"\")\nif not hmac.compare_digest(cle_recue.encode(), CLE_ATTENDUE.encode()):\n    return self.envoyer_probleme(401, \"Clé API invalide\")", "takeaway": "Pour vérifier un jeton, un hash ou une clé API, remplacez systématiquement == par hmac.compare_digest()."}, {"number": 95, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Contrôle d'Accès", "title": "Authentification (401) vs Autorisation (403)", "subtitle": "Séparer la preuve d'identité de la vérification des droits d'action.", "definition": "L'authentification (AuthN) vérifie qui appelle l'API, tandis que l'autorisation (AuthZ) décide si cette identité reconnue a le droit d'effectuer l'action.", "points": [{"label": "Ordre d'exécution", "text": "Le handler authentifie d'abord l'appelant avant d'évaluer ses permissions métiers."}, {"label": "Clarté côté client", "text": "Un 401 invite à se reconnecter, alors qu'un 403 indique un refus définitif de privilège."}], "comparison": {"left_title": "401 Unauthorized (Identité)", "left_items": ["Qui êtes-vous ?", "Jeton absent, expiré ou falsifié", "Accompagné de WWW-Authenticate"], "right_title": "403 Forbidden (Permission)", "right_items": ["Identité valide et connue", "Rôle insuffisant pour cette route", "Se reconnecter ne changera rien"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "401 signifie je ne sais pas qui vous êtes ; 403 signifie je vous reconnais mais cet accès vous est interdit."}, {"number": 96, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Standard HTTP", "title": "L'en-tête WWW-Authenticate lors d'un rejet 401", "subtitle": "Respecter la norme HTTP en indiquant comment s'authentifier correctement.", "definition": "Toute réponse 401 Unauthorized doit comporter l'en-tête WWW-Authenticate précisant le schéma d'authentification attendu par le serveur (Bearer, ApiKey, etc.).", "points": [{"label": "Exigence RFC 9110", "text": "Sans WWW-Authenticate, un client générique ignore quel format d'identifiant fournir."}, {"label": "Diagnostic précis", "text": "L'attribut error=\"invalid_token\" distingue un jeton expiré d'un en-tête manquant."}], "comparison": null, "code_label": "Réponse HTTP 401 conforme RFC", "code_lang": "http", "code": "HTTP/1.1 401 Unauthorized\nWWW-Authenticate: Bearer realm=\"isgp-api\", error=\"invalid_token\"\nContent-Type: application/problem+json; charset=utf-8\n\n{\"title\": \"Jeton invalide ou expiré\", \"status\": 401}", "takeaway": "Posez toujours self.set_header('WWW-Authenticate', 'Bearer') avant d'émettre un statut 401."}, {"number": 97, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Jetons Bearer", "title": "Anatomie d'un Jeton Signé (JWT) : Header.Payload.Signature", "subtitle": "Transporter une identité vérifiable sans interroger une session centrale.", "definition": "Un JSON Web Token est une chaîne compacte en trois segments encodés en Base64URL séparés par des points : l'algorithme, les revendications et la signature.", "points": [{"label": "Header (En-tête)", "text": "Déclare le type du jeton et l'algorithme cryptographique utilisé comme HS256."}, {"label": "Payload (Claims)", "text": "Contient l'identifiant sujet sub, le rôle role et la date d'expiration exp."}, {"label": "Signature", "text": "Scelle mathématiquement les deux premiers blocs avec la clé secrète du serveur."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Un jeton signé permet au serveur Tornado de vérifier l'identité et l'expiration en quelques microsecondes."}, {"number": 98, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Intégrité Cryptographique", "title": "Signature HMAC-SHA256 : Base64 n'est pas du chiffrement", "subtitle": "Garantir l'authenticité du jeton sans jamais y glisser de secret lisible.", "definition": "HMAC-SHA256 prouve que le contenu du jeton n'a pas été modifié depuis son émission par le serveur, mais le Payload reste décodable par quiconque possède le jeton.", "points": [{"label": "Visibilité totale", "text": "N'importe qui peut décoder le segment Payload Base64URL en une ligne Python."}, {"label": "Falsification impossible", "text": "Changer role='etudiant' en role='admin' invalide immédiatement la signature HMAC."}, {"label": "Sobriété du Payload", "text": "Y placer uniquement sub, role, iat et exp : jamais de mot de passe ni de donnée privée."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "La signature protège contre la modification, pas contre la lecture : ne mettez rien de secret dans un JWT."}, {"number": 99, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Cycle des Jetons", "title": "Access Token (court) vs Refresh Token (long et révocable)", "subtitle": "Concilier performance sans état et capacité de révocation rapide.", "definition": "L'architecture moderne associe un jeton d'accès à durée très brève pour chaque appel API et un jeton de rafraîchissement stocké en base pour renouveler la session.", "points": [{"label": "Fenêtre de risque réduite", "text": "Un Access Token volé cesse automatiquement de fonctionner au bout de 15 minutes."}, {"label": "Déconnexion réelle", "text": "Supprimer le Refresh Token en base bloque immédiatement tout renouvellement futur."}], "comparison": {"left_title": "Access Token (15 min)", "left_items": ["Envoyé sur chaque requête API", "Vérifié en mémoire par signature", "Non stocké en base de données"], "right_title": "Refresh Token (7 à 30 jours)", "right_items": ["Envoyé uniquement sur /auth/refresh", "Enregistré et révocable en base", "Rotation à chaque renouvellement"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Des Access Tokens courts limitent l'impact d'une fuite sans sacrifier le confort grâce au Refresh Token."}, {"number": 100, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Modèle de Droits", "title": "Contrôle d'accès par rôles (RBAC) et Scopes granulaires", "subtitle": "Structurer les autorisations métiers selon le principe du moindre privilège.", "definition": "Le RBAC attribue des permissions à des rôles métiers (lecteur, formateur, admin), tandis que les scopes affinent les actions permises à un jeton précis.", "points": [{"label": "Moindre privilège", "text": "Un compte ou un jeton ne reçoit que les permissions strictement nécessaires à sa mission."}, {"label": "Rôles lisibles", "text": "Regrouper les droits par fonction métier évite de gérer des règles par individu."}, {"label": "Scopes limitatifs", "text": "Un script d'export reçoit le scope catalogue:read sans jamais pouvoir supprimer."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Refusez tout par défaut dans l'API, puis ouvrez chaque route explicitement aux rôles et scopes requis."}, {"number": 101, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Patron Tornado", "title": "Décorateur @exiger_role sur un RequestHandler Tornado", "subtitle": "Rendre la politique d'autorisation déclarative et lisible sur chaque méthode.", "definition": "Un décorateur Python enveloppe get, post ou delete pour vérifier self.current_user et son rôle avant même d'exécuter une seule ligne de logique métier.", "points": [{"label": "get_current_user()", "text": "Méthode native de Tornado extrayant l'utilisateur courant depuis le jeton ou le cookie."}, {"label": "Double barrière", "text": "Renvoie 401 si aucun utilisateur n'est identifié, puis 403 si le rôle est insuffisant."}], "comparison": null, "code_label": "Décorateur RBAC idiomatique pour Tornado", "code_lang": "python", "code": "def exiger_role(*roles: str):\n    def deco(fn):\n        def wrap(self, *args, **kw):\n            if not self.current_user or self.current_user[\"role\"] not in roles:\n                return self.envoyer_probleme(403 if self.current_user else 401, \"Accès refusé\")\n            return fn(self, *args, **kw)\n        return wrap\n    return deco", "takeaway": "Un décorateur @exiger_role('admin') rend la règle de sécurité immédiatement visible lors d'une revue de code."}, {"number": 102, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "OWASP API #1", "title": "Faille critique OWASP API #1 : BOLA", "subtitle": "Être authentifié ne donne pas le droit de lire le dossier du voisin.", "definition": "Broken Object Level Authorization (BOLA) survient quand une API vérifie que l'appelant est connecté mais oublie de vérifier qu'il est propriétaire de l'ID demandé.", "points": [{"label": "Attaque par énumération", "text": "Changer /api/inscriptions/42 en /api/inscriptions/43 expose le dossier d'un tiers."}, {"label": "Filtrage propriétaire", "text": "Toujours inclure AND user_id = ? directement dans la clause WHERE de la requête SQL."}], "comparison": {"left_title": "Code vulnérable à BOLA", "left_items": ["Vérifie seulement le jeton valide", "SELECT * FROM dossiers WHERE id = ?", "N'importe quel inscrit lit tout"], "right_title": "Code protégé au niveau objet", "right_items": ["Extrait user_id du jeton vérifié", "WHERE id = ? AND user_id = ?", "Renvoie 404 ou 403 aux tiers"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Chaque route contenant un identifiant d'objet doit vérifier l'appartenance de cet objet à self.current_user."}, {"number": 103, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Sessions Tornado", "title": "Cookies signés natifs dans Tornado : set_secure_cookie", "subtitle": "Exploiter le mécanisme cryptographique intégré à tornado.web.Application.", "definition": "Tornado fournit nativement des cookies signés par HMAC-SHA256 avec horodatage anti-rejeu dès lors que le paramètre cookie_secret est défini sur l'application.", "points": [{"label": "Écriture signée", "text": "set_secure_cookie encode la valeur, l'horodate et appose une signature cryptographique."}, {"label": "Lecture vérifiée", "text": "get_secure_cookie renvoie None automatiquement si le cookie a été altéré ou a expiré."}], "comparison": null, "code_label": "Émission et lecture d'un cookie signé Tornado", "code_lang": "python", "code": "# Écriture après authentification réussie\nself.set_secure_cookie(\"session_isgp\", user_id, httponly=True, samesite=\"Lax\")\n\n# Lecture sûre dans get_current_user()\nvaleur = self.get_secure_cookie(\"session_isgp\", max_age_days=1)", "takeaway": "N'utilisez jamais get_cookie pour l'identité : exigez toujours get_secure_cookie adossé à cookie_secret."}, {"number": 104, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Sécurité Navigateur", "title": "Les 3 drapeaux d'un Cookie : HttpOnly, Secure, SameSite", "subtitle": "Verrouiller le stockage navigateur contre le vol XSS et l'envoi inter-sites.", "definition": "Trois attributs standardisés instruisent le navigateur sur la manière stricte d'isoler, transporter et restreindre automatiquement un cookie de session.", "points": [{"label": "HttpOnly", "text": "Rend le cookie invisible à document.cookie, bloquant son vol par un script XSS."}, {"label": "Secure", "text": "Interdit au navigateur de transmettre le cookie sur une connexion HTTP non chiffrée."}, {"label": "SameSite=Lax ou Strict", "text": "Empêche l'envoi automatique du cookie lors de requêtes forgées depuis un site tiers."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Tout cookie d'authentification en production cumule obligatoirement HttpOnly, Secure et SameSite=Lax."}, {"number": 105, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Protection CSRF", "title": "Attaque CSRF et protection xsrf_cookies=True dans Tornado", "subtitle": "Empêcher un site malveillant de déclencher une action avec vos cookies.", "definition": "Le Cross-Site Request Forgery force le navigateur d'un utilisateur connecté à envoyer une requête mutative involontaire en exploitant l'envoi automatique des cookies.", "points": [{"label": "Mécanisme natif", "text": "Activer xsrf_cookies=True exige un jeton aléatoire _xsrf sur chaque POST, PUT ou DELETE."}, {"label": "En-tête X-XSRFToken", "text": "Un script fetch() lit le cookie _xsrf et le renvoie dans l'en-tête X-XSRFToken."}, {"label": "Exception Bearer", "text": "Une route authentifiée exclusivement par en-tête Authorization Bearer n'est pas sujette au CSRF."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Si votre API s'appuie sur des cookies de session, activez xsrf_cookies=True pour bloquer toute forge CSRF."}, {"number": 106, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Disponibilité API", "title": "Rate Limiting : 429 Too Many Requests et Retry-After", "subtitle": "Imposer un quota d'appels par fenêtre glissante pour préserver le serveur.", "definition": "Le Rate Limiting comptabilise la fréquence des requêtes par IP ou par clé API afin de bloquer les abus et la force brute avant l'épuisement des ressources.", "points": [{"label": "Quotas différenciés", "text": "Appliquer un seuil strict sur /auth/login (ex. 5/min) et plus large sur le catalogue."}, {"label": "Guidage du client", "text": "L'en-tête Retry-After indique en secondes quand le client peut légitimement réessayer."}], "comparison": null, "code_label": "Réponse HTTP 429 normalisée", "code_lang": "http", "code": "HTTP/1.1 429 Too Many Requests\nRetry-After: 30\nX-RateLimit-Remaining: 0\nContent-Type: application/problem+json; charset=utf-8\n\n{\"title\": \"Quota d'appels dépassé\", \"status\": 429}", "takeaway": "Sans Rate Limiting sur l'authentification et les recherches lourdes, un seul script peut saturer l'API."}, {"number": 107, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Politique CORS", "title": "Politique CORS : set_default_headers() et options()", "subtitle": "Autoriser proprement un front-end hébergé sur un autre domaine.", "definition": "Cross-Origin Resource Sharing est un protocole d'en-têtes HTTP par lequel l'API déclare explicitement au navigateur quelles origines externes peuvent lire ses réponses.", "points": [{"label": "Origine explicite", "text": "Préférer l'origine exacte https://portail.isgp.dz plutôt que le joker permissif *."}, {"label": "Pré-vérification OPTIONS", "text": "Avant un POST JSON ou un en-tête Authorization, le navigateur envoie une requête OPTIONS."}], "comparison": null, "code_label": "Gestion CORS propre dans BaseAPIHandler", "code_lang": "python", "code": "def set_default_headers(self) -> None:\n    self.set_header(\"Access-Control-Allow-Origin\", \"https://portail.isgp.dz\")\n    self.set_header(\"Access-Control-Allow-Headers\", \"Content-Type, Authorization\")\n    self.set_header(\"Access-Control-Allow-Methods\", \"GET, POST, PATCH, DELETE, OPTIONS\")\n\ndef options(self, *args) -> None:\n    self.set_status(204)\n    self.finish()", "takeaway": "CORS n'est pas un pare-feu serveur : c'est une consigne de sécurité destinée aux navigateurs Web."}, {"number": 108, "part_id": "P6", "part_title": "Partie 6 — Sécurité, Cryptographie, Authentification & Résilience", "tag": "Événements Entrants", "title": "Webhooks sécurisés : Vérifier la signature HMAC entrante", "subtitle": "S'assurer qu'une notification de paiement provient réellement du partenaire.", "definition": "Un webhook est une requête POST envoyée par un service tiers vers votre API ; son authenticité se vérifie en recalculant le HMAC-SHA256 sur les octets bruts reçus.", "points": [{"label": "Octets intacts", "text": "Calculer la signature sur self.request.body exact avant tout reformatage JSON."}, {"label": "Anti-rejeu horodaté", "text": "Rejeter toute notification dont l'horodatage s'écarte de plus de cinq minutes."}], "comparison": null, "code_label": "Validation cryptographique d'un webhook entrant", "code_lang": "python", "code": "import hashlib, hmac\n\nsig_recue = self.request.headers.get(\"X-Webhook-Signature\", \"\")\nsig_calculee = hmac.new(SECRET_WEBHOOK, self.request.body, hashlib.sha256).hexdigest()\nif not hmac.compare_digest(sig_recue, sig_calculee):\n    return self.envoyer_probleme(401, \"Signature webhook invalide\")", "takeaway": "Un endpoint webhook public sans vérification HMAC permet à n'importe qui de simuler un paiement validé."}, {"number": 109, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Client HTTP Async", "title": "Appeler une API externe avec AsyncHTTPClient", "subtitle": "Interroger un service distant sans figer la boucle événementielle Tornado.", "definition": "tornado.httpclient.AsyncHTTPClient exécute des requêtes HTTP sortantes non bloquantes afin que le serveur continue à servir des centaines d'autres clients pendant l'attente.", "points": [{"label": "Piège classique", "text": "Utiliser urllib.request ou un client synchrone bloque tout le processus Tornado."}, {"label": "Parallélisme natif", "text": "Plusieurs appels AsyncHTTPClient peuvent s'exécuter en parallèle avec asyncio.gather."}], "comparison": null, "code_label": "Appel sortant non bloquant dans un handler", "code_lang": "python", "code": "from tornado.httpclient import AsyncHTTPClient\n\nclass TauxChangeHandler(BaseAPIHandler):\n    async def get(self) -> None:\n        client = AsyncHTTPClient()\n        rep = await client.fetch(\"https://api.partenaire.dz/taux\")\n        self.write(rep.body)", "takeaway": "Dans un serveur Tornado, tout appel HTTP sortant s'effectue obligatoirement avec AsyncHTTPClient."}, {"number": 110, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Résilience Réseau", "title": "Imposer connect_timeout et request_timeout systématiques", "subtitle": "Empêcher la lenteur d'un partenaire externe de faire tomber votre API.", "definition": "Un timeout borne la durée maximale d'établissement TCP et de réponse complète afin de libérer rapidement les sockets et de renvoyer un statut 504 maîtrisé.", "points": [{"label": "connect_timeout", "text": "Temps maximal accordé pour établir la connexion TCP initiale (souvent 2 secondes)."}, {"label": "request_timeout", "text": "Durée totale maximale de l'échange HTTP de bout en bout (souvent 5 secondes)."}, {"label": "Dégradation gracieuse", "text": "Intercepter HTTPClientError pour servir un cache de secours ou un code 502 / 504 clair."}], "comparison": null, "code_label": "Requête externe bornée dans le temps", "code_lang": "python", "code": "from tornado.httpclient import AsyncHTTPClient, HTTPRequest, HTTPClientError\n\nreq = HTTPRequest(url, connect_timeout=2.0, request_timeout=5.0)\ntry:\n    rep = await AsyncHTTPClient().fetch(req)\nexcept HTTPClientError:\n    return self.envoyer_probleme(504, \"Service partenaire indisponible\")", "takeaway": "Un appel réseau sans timeout explicite est une panne en cascade qui attend de se produire."}, {"number": 111, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Architecture Code", "title": "Architecture modulaire : Organiser routes et handlers", "subtitle": "Découper une application Tornado grandissante en couches lisibles et testables.", "definition": "Une architecture modulaire sépare les RequestHandlers HTTP, la validation métier et l'accès aux données SQLite dans des modules dédiés par domaine fonctionnel.", "points": [{"label": "handlers/ (Couche HTTP)", "text": "Lit la requête, appelle le service métier et formate le statut et le JSON de sortie."}, {"label": "services/ (Règles métier)", "text": "Concentre les calculs, quotas et validations indépendamment du protocole Web."}, {"label": "repositories/ (SQLite)", "text": "Encapsule toutes les requêtes SQL paramétrées sans fuite dans les handlers."}, {"label": "routes.py (Registre)", "text": "Assemble proprement les tuples URLSpec de chaque domaine dans Application."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Un RequestHandler svelte ne contient aucune requête SQL brute : il orchestre l'entrée HTTP et la réponse."}, {"number": 112, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Évolution API", "title": "Versioning (/api/v1 vs /api/v2) et en-têtes Sunset", "subtitle": "Faire évoluer le contrat JSON sans jamais casser les clients déjà déployés.", "definition": "Le versioning d'URI isole les changements incompatibles sous un nouveau préfixe tandis que les en-têtes Deprecation et Sunset (RFC 8594) annoncent la fin d'une ancienne version.", "points": [{"label": "Changement rétrocompatible", "text": "Ajouter un champ optionnel en réponse ne casse rien et reste dans /api/v1."}, {"label": "Rupture de contrat", "text": "Renommer un champ ou modifier son type impose d'ouvrir une branche /api/v2."}, {"label": "Retrait planifié", "text": "L'en-tête Sunset communique la date exacte d'extinction aux équipes clientes."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "On n'écrase jamais en place un contrat consommé en production : on étend v1 ou on publie v2."}, {"number": 113, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Observabilité", "title": "Sondes GET /health et corrélation par X-Request-ID", "subtitle": "Permettre aux équilibreurs de charge et aux équipes d'exploitation de diagnostiquer l'API.", "definition": "La route /health expose l'état vital du service et de sa base SQLite, tandis que l'identifiant X-Request-ID relie la réponse client à la ligne exacte des logs serveur.", "points": [{"label": "Traçabilité instantanée", "text": "Générer un UUID dans prepare() et le renvoyer dans l'en-tête X-Request-ID."}, {"label": "Vérification réelle", "text": "Une sonde Readiness exécute SELECT 1 sur SQLite et renvoie 503 en cas d'échec."}], "comparison": {"left_title": "Sonde Liveness (/health/live)", "left_items": ["Vérifie que l'IOLoop répond", "Aucun appel base de données", "Déclenche un redémarrage si figé"], "right_title": "Sonde Readiness (/health/ready)", "right_items": ["Teste SQLite et les dépendances", "Renvoie 200 ou 503 Unavailable", "Coupe le trafic entrant si dégradé"]}, "code_label": "Réponse JSON d'une sonde de santé", "code_lang": "json", "code": "{\n  \"statut\": \"operationnel\",\n  \"sqlite_wal\": \"ok\",\n  \"version\": \"1.4.0\",\n  \"request_id\": \"req-9f3a21c8\"\n}", "takeaway": "Un bon X-Request-ID transforme une heure de recherche dans les logs en cinq secondes de diagnostic."}, {"number": 114, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Performance SQL", "title": "Pagination : Offset / Limit vs Pagination par Curseur", "subtitle": "Garder des temps de réponse constants même sur des millions d'enregistrements.", "definition": "La pagination découpe une grande collection en tranches bornées, soit par décalage numérique (OFFSET), soit à partir du dernier identifiant trié observé (Keyset).", "points": [{"label": "Coût caché d'OFFSET", "text": "OFFSET 100000 oblige SQLite à balayer puis jeter cent mille lignes avant de répondre."}, {"label": "Stabilité du curseur", "text": "Filtrer avec WHERE id > ? LIMIT 20 exploite directement l'index de clé primaire."}], "comparison": {"left_title": "Offset / Limit (?page=3&limit=20)", "left_items": ["Accès direct au numéro de page", "Ralentit sur les pages profondes", "Décalages possibles lors d'ajouts"], "right_title": "Curseur Keyset (?after_id=840)", "right_items": ["Temps constant O(1) via l'index", "Aucun doublon ni saut en flux vif", "Idéal pour défilement infini et API"]}, "code_label": "", "code_lang": "", "code": "", "takeaway": "Utilisez Offset/Limit pour les petits catalogues back-office et un curseur indexé pour les gros volumes."}, {"number": 115, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Qualité Logicielle", "title": "Tests automatisés avec AsyncHTTPTestCase", "subtitle": "Vérifier chaque statut, en-tête et corps JSON en quelques millisecondes.", "definition": "tornado.testing.AsyncHTTPTestCase démarre votre Application sur un port éphémère isolé en mémoire et fournit self.fetch() pour tester vos routes de bout en bout.", "points": [{"label": "Zéro serveur manuel", "text": "Chaque test monte et démonte proprement sa propre boucle IOLoop et sa base temporaire."}, {"label": "Couverture complète", "text": "Tester systématiquement le cas nominal (200/201) et les rejets (400, 401, 404, 422)."}], "comparison": null, "code_label": "Test d'intégration natif avec AsyncHTTPTestCase", "code_lang": "python", "code": "from tornado.testing import AsyncHTTPTestCase\n\nclass CatalogueTest(AsyncHTTPTestCase):\n    def get_app(self):\n        return creer_application(db_path=\":memory:\")\n\n    def test_liste_formations_200(self):\n        rep = self.fetch(\"/api/formations\")\n        self.assertEqual(rep.code, 200)", "takeaway": "Un test AsyncHTTPTestCase valide le vrai routage HTTP, la sérialisation JSON et les codes d'état."}, {"number": 116, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Documentation Vivante", "title": "Exposer OpenAPI 3.0 (/api/openapi.json) et Swagger UI", "subtitle": "Fournir un contrat lisible par les machines et testable dans le navigateur.", "definition": "OpenAPI 3.0 décrit formellement en JSON l'ensemble des routes, paramètres, schémas et codes de retour d'une API afin d'alimenter automatiquement Swagger UI.", "points": [{"label": "Contrat explicite", "text": "Dans Tornado, un dictionnaire Python structuré sert directement /api/openapi.json."}, {"label": "Bac à sable /api/docs", "text": "Une simple page HTML chargeant Swagger UI permet d'essayer chaque route en direct."}, {"label": "Génération de clients", "text": "Les équipes mobiles et partenaires génèrent leurs SDK à partir de ce fichier unique."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Une API sans contrat OpenAPI à jour oblige chaque intégrateur à lire le code serveur ou à deviner."}, {"number": 117, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Cache HTTP", "title": "Cache conditionnel : ETag, If-None-Match et 304", "subtitle": "Économiser la bande passante lorsque la ressource n'a pas changé.", "definition": "Un ETag est l'empreinte de version d'une réponse ; si le client la renvoie dans If-None-Match et qu'elle est toujours valide, le serveur répond 304 Not Modified sans corps.", "points": [{"label": "Support natif Tornado", "text": "RequestHandler calcule automatiquement un ETag SHA1 sur le tampon d'écriture des GET."}, {"label": "Gain réseau majeur", "text": "Un catalogue de 80 Ko inchangé ne transfère plus que quelques octets d'en-têtes."}], "comparison": null, "code_label": "Échange conditionnel avec ETag", "code_lang": "http", "code": "GET /api/formations HTTP/1.1\nIf-None-Match: \"a94a8fe5ccb19ba6\"\n\nHTTP/1.1 304 Not Modified\nETag: \"a94a8fe5ccb19ba6\"", "takeaway": "Tornado gère nativement compute_etag() sur vos réponses GET : exploitez-le pour alléger le réseau."}, {"number": 118, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Tâches Longues", "title": "Traitements longs asynchrones et statut 202 Accepted", "subtitle": "Ne jamais garder une requête HTTP ouverte pendant trente secondes de calcul.", "definition": "Lorsqu'un traitement dépasse quelques centaines de millisecondes (génération PDF, export massif), l'API enregistre la demande et répond immédiatement 202 Accepted.", "points": [{"label": "Réponse immédiate", "text": "Le corps 202 retourne un identifiant job_id et une URL de suivi /api/taches/{id}."}, {"label": "Exécution en arrière-plan", "text": "Un worker dédié traite la file sans risquer de timeout proxy 504 côté client."}, {"label": "Consultation d'état", "text": "Le client interroge l'état (en_attente, en_cours, termine) jusqu'à disponibilité."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "Au-delà d'une seconde de traitement prévisible, préférez le patron 202 Accepted + ressource de suivi."}, {"number": 119, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Flux Temps Réel", "title": "Temps réel serveur vers client : Server-Sent Events (SSE)", "subtitle": "Pousser des notifications en continu sur une simple connexion HTTP standard.", "definition": "Server-Sent Events maintient une réponse HTTP ouverte de type text/event-stream sur laquelle Tornado pousse des événements texte via self.write() et await self.flush().", "points": [{"label": "Simplicité native", "text": "L'API navigateur EventSource gère nativement la reconnexion automatique en cas de coupure."}, {"label": "Idéal pour les tableaux de bord", "text": "Suivi de progression, alertes métier ou métriques en direct sans surcharge de polling."}], "comparison": null, "code_label": "Flux SSE asynchrone dans un handler Tornado", "code_lang": "python", "code": "class FluxAlertesHandler(tornado.web.RequestHandler):\n    async def get(self) -> None:\n        self.set_header(\"Content-Type\", \"text/event-stream; charset=utf-8\")\n        self.set_header(\"Cache-Control\", \"no-cache\")\n        self.write(\"data: {\\\"statut\\\": \\\"connecte\\\"}\\n\\n\")\n        await self.flush()", "takeaway": "Quand seul le serveur a besoin de pousser des mises à jour vers le navigateur, SSE est plus simple que WebSocket."}, {"number": 120, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "WebSockets Tornado", "title": "Temps réel bidirectionnel : WebSocketHandler", "subtitle": "Une force historique de Tornado pour le dialogue instantané full-duplex.", "definition": "tornado.websocket.WebSocketHandler promeut une connexion HTTP en canal TCP persistant bidirectionnel permettant au client et au serveur d'échanger à tout instant.", "points": [{"label": "Cycle d'événements", "text": "Trois méthodes structurent le handler : open(), on_message(msg) et on_close()."}, {"label": "Sécurité d'origine", "text": "Toujours surcharger check_origin(origin) pour bloquer les connexions inter-sites non voulues."}], "comparison": {"left_title": "SSE (text/event-stream)", "left_items": ["Unidirectionnel serveur vers client", "HTTP classique, reconnexion auto", "Parfait pour notifications et flux"], "right_title": "WebSocket (ws:// / wss://)", "right_items": ["Bidirectionnel temps réel complet", "Protocole dédié faible latence", "Idéal pour chat et édition collaborative"]}, "code_label": "Squelette d'un WebSocketHandler Tornado", "code_lang": "python", "code": "from tornado.websocket import WebSocketHandler\n\nclass SalonDirectHandler(WebSocketHandler):\n    def open(self) -> None:\n        self.write_message({\"evenement\": \"bienvenue\"})\n\n    def on_message(self, message: str) -> None:\n        self.write_message({\"echo\": message})", "takeaway": "Tornado excelle sur des milliers de WebSockets simultanés grâce à son architecture asynchrone native."}, {"number": 121, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Déploiement Prod", "title": "Topologie de production : Nginx + Cluster Tornado", "subtitle": "Exploiter tous les cœurs CPU derrière un reverse proxy frontal.", "definition": "En production, Nginx termine le chiffrement TLS sur le port 443 et répartit le trafic HTTP vers plusieurs processus Tornado autonomes (un par cœur CPU).", "points": [{"label": "Rôle de Nginx", "text": "Gère les certificats HTTPS, la compression gzip, les fichiers statiques et le filtrage lent."}, {"label": "Contournement du GIL", "text": "Lancer 4 processus Tornado sur les ports 8001 à 8004 exploite pleinement 4 cœurs CPU."}, {"label": "Supervision systemd", "text": "Chaque instance Tornado redémarre automatiquement en moins d'une seconde en cas d'arrêt."}], "comparison": null, "code_label": "Bloc upstream Nginx vers 2 workers Tornado", "code_lang": "nginx", "code": "upstream tornado_isgp {\n    server 127.0.0.1:8001;\n    server 127.0.0.1:8002;\n}\nlocation /api/ {\n    proxy_pass http://tornado_isgp;\n    proxy_set_header X-Real-IP $remote_addr;\n}", "takeaway": "Ne placez jamais un processus Python directement sur le port 443 public sans reverse proxy frontal."}, {"number": 122, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Réseau Proxy", "title": "Récupérer la vraie IP cliente : HTTPServer(app, xheaders=True)", "subtitle": "Éviter que tous les appels n'apparaissent sous l'adresse locale 127.0.0.1.", "definition": "Lorsque Tornado tourne derrière Nginx, activer xheaders=True dans HTTPServer instruit Tornado de lire X-Real-IP et X-Forwarded-Proto pour peupler request.remote_ip.", "points": [{"label": "Impact sur le Rate-Limit", "text": "Sans xheaders=True, votre limiteur bloque 127.0.0.1 et coupe tous les utilisateurs d'un coup."}, {"label": "Condition de confiance", "text": "N'activez xheaders=True que si le port Tornado est inaccessible en direct depuis Internet."}], "comparison": null, "code_label": "Démarrage du serveur Tornado derrière un proxy de confiance", "code_lang": "python", "code": "from tornado.httpserver import HTTPServer\nfrom tornado.ioloop import IOLoop\n\nserveur = HTTPServer(app, xheaders=True)\nserveur.listen(8001, address=\"127.0.0.1\")\nIOLoop.current().start()", "takeaway": "Écoutez sur 127.0.0.1 et activez xheaders=True pour un Rate Limiting et des logs d'audit exacts."}, {"number": 123, "part_id": "P7", "part_title": "Partie 7 — Production, Client Async, OpenAPI, Cache & Temps Réel", "tag": "Journaux d'Audit", "title": "Journalisation structurée avec log_function", "subtitle": "Produire une ligne JSON exploitable à la fin de chaque requête HTTP.", "definition": "Le paramètre log_function de tornado.web.Application remplace le journal texte par défaut par une fonction personnalisée émettant des événements d'audit structurés.", "points": [{"label": "Métriques clés", "text": "Enregistrer méthode, URI, code HTTP, durée en ms (request.request_time ": "Le mémento opérationnel à garder sous les yeux sur chaque projet.", "definition": "Ces dix principes synthétisent l'ensemble des bonnes pratiques architecturales, sécuritaires et opérationnelles étudiées tout au long du bootcamp.", "points": [{"label": "1–3 Contrat & Validation", "text": "Respecter les verbes/statuts HTTP, valider tout côté serveur et normaliser les erreurs en RFC 7807."}, {"label": "4–5 Asynchronisme & SQL", "text": "Ne jamais bloquer l'IOLoop (AsyncHTTPClient, run_in_executor) et bannir toute concaténation SQL."}, {"label": "6–8 Sécurité en profondeur", "text": "Zéro secret en code, PBKDF2 + compare_digest, RBAC + anti-BOLA et Rate Limiting 429."}, {"label": "9–10 Production & Qualité", "text": "Documenter en OpenAPI 3.0, exposer /health + X-Request-ID et automatiser AsyncHTTPTestCase."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "takeaway": "La rigueur sur les fondamentaux distingue un prototype fragile d'une API robuste qui dure dix ans."}, {"number": 136, "part_id": "P8", "part_title": "Partie 8 — Parcours Zero-to-Hero en 6 Étapes & Synthèse", "tag": "Conclusion", "title": "Conclusion & Passage à la Pratique — Place au Code !", "subtitle": "Vous disposez de toutes les briques pour bâtir des API Tornado de niveau production.", "definition": "De la compréhension intime du protocole HTTP et de la boucle IOLoop jusqu'à SQLite WAL, la cryptographie et OpenAPI, vous maîtrisez toute la chaîne sans magie cachée.", "points": [{"label": "Maîtrise de bout en bout", "text": "Vous savez exactement comment chaque octet HTTP est lu, validé, persisté, signé et journalisé."}, {"label": "Prochaine action immédiate", "text": "Parcourir le laboratoire Zero-to-Hero, éprouver chaque endpoint et construire votre propre service."}, {"label": "Esprit d'ingénieur", "text": "Privilégier toujours la clarté du contrat, la défense en profondeur et les tests automatisés."}], "comparison": null, "code_label": "", "code_lang": "", "code": "", "tak /* ==========================================================================

   Navigation clavier/tactile, Vue Grille, Recherche, Plein Écran Paysage & PDF
   ========================================================================== */

(function () {
  "use strict";

  let DECK = { meta: {}, parts: [], slides: [] };
  let currentIdx = 0;
  let touchStartX = null;

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatInlineCode(str) {
    return escapeHtml(str).replace(/`([^`]+)`/g, "<code>$1</code>");
  }

  function highlightFragment(code, lang) {
    const lines = String(code || "").split("\n");
    return lines
      .map((rawLine) => {
        const trimmed = rawLine.trim();
        if (trimmed.startsWith("#") || trimmed.startsWith("//") || trimmed.startsWith("--")) {
          return '<span class="tok-cmt">' + escapeHtml(rawLine) + "</span>";
        }
        let html = escapeHtml(rawLine);
        html = html.replace(/(&quot;[^&]*?&quot;|'[^']*?')/g, '<span class="tok-str">$1</span>');
        if (lang === "python" || !lang) {
          html = html.replace(
            /\b(class|def|async|await|return|import|from|if|elif|else|for|in|try|except|finally|with|as|raise|None|True|False|and|or|not)\b/g,
            '<span class="tok-kw">$1</span>'
          );
          html = html.replace(/(^|\s)(@[A-Za-z0-9_.]+)/g, '$1<span class="tok-dec">$2</span>');
        } else if (lang === "http") {
          html = html.replace(
            /\b(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD|HTTP\/1\.1)\b/g,
            '<span class="tok-kw">$1</span>'
          );
        } else if (lang === "sql") {
          html = html.replace(
            /\b(SELECT|INSERT|INTO|VALUES|UPDATE|SET|DELETE|FROM|WHERE|CREATE|TABLE|IF|NOT|EXISTS|PRIMARY|KEY|PRAGMA|BEGIN|COMMIT|ORDER|BY|LIMIT|OFFSET)\b/gi,
            '<span class="tok-kw">$1</span>'
          );
        }
        return html;
      })
      .join("\n");
  }

  function pad3(n) {
    return String(n).padStart(3, "0");
  }

  function buildSlideInnerHtml(slide, total, forPrint) {
    const hasCode = Boolean(slide.code && slide.code.trim());
    const hasCompare = Boolean(slide.comparison && slide.comparison.left_title);
    const points = Array.isArray(slide.points) ? slide.points : [];

    const pointsHtml = points
      .map(
        (pt, idx) =>
          '<div class="slide-point-card">' +
          '<span class="slide-point-index">' +
          (idx + 1) +
          "</span>" +
          '<div class="slide-point-content">' +
          (pt.label ? "<strong>" + formatInlineCode(pt.label) + " :</strong> " : "") +
          formatInlineCode(pt.text || "") +
          "</div></div>"
      )
      .join("");

    let compareHtml = "";
    if (hasCompare) {
      const c = slide.comparison;
      const leftItems = (c.left_items || [])
        .map((it) => '<div class="slide-compare-item">' + formatInlineCode(it) + "</div>")
        .join("");
      const rightItems = (c.right_items || [])
        .map((it) => '<div class="slide-compare-item">' + formatInlineCode(it) + "</div>")
        .join("");
      compareHtml =
        '<div class="slide-compare-grid">' +
        '<div class="slide-compare-col col-left">' +
        '<h3 class="slide-compare-title">' +
        formatInlineCode(c.left_title) +
        "</h3>" +
        '<div class="slide-compare-items">' +
        leftItems +
        "</div></div>" +
        '<div class="slide-compare-col col-right">' +
        '<h3 class="slide-compare-title">' +
        formatInlineCode(c.right_title) +
        "</h3>" +
        '<div class="slide-compare-items">' +
        rightItems +
        "</div></div></div>";
    }

    let codeHtml = "";
    if (hasCode) {
      const copyBtn = forPrint
        ? ""
        : '<button type="button" class="slide-copy-btn" onclick="window.copyCurrentSlideCode(this)">Copier</button>';
      codeHtml =
        '<div class="slide-code-panel">' +
        '<div class="slide-code-header">' +
        '<span class="slide-code-label">' +
        escapeHtml(slide.code_label || "Fragment de référence") +
        "</span>" +
        '<div class="slide-code-actions">' +
        '<span class="slide-code-lang">' +
        escapeHtml(slide.code_lang || "code") +
        "</span>" +
        copyBtn +
        "</div></div>" +
        '<pre class="slide-code-pre"><code>' +
        highlightFragment(slide.code, slide.code_lang) +
        "</code></pre></div>";
    }

    let bodyHtml = "";
    if (hasCode) {
      bodyHtml =
        '<div class="slide-body layout-split">' +
        '<div class="slide-points-list">' +
        (hasCompare ? compareHtml : "") +
        pointsHtml +
        "</div>" +
        codeHtml +
        "</div>";
    } else if (hasCompare) {
      bodyHtml =
        '<div class="slide-body">' +
        compareHtml +
        (points.length ? '<div class="slide-points-grid">' + pointsHtml + "</div>" : "") +
        "</div>";
    } else {
      bodyHtml =
        '<div class="slide-body"><div class="slide-points-grid">' + pointsHtml + "</div></div>";
    }

    return (
      '<div>' +
      '<div class="slide-meta-row">' +
      '<div class="slide-badges">' +
      '<span class="slide-part-pill">' +
      escapeHtml(slide.part_title) +
      "</span>" +
      '<span class="slide-tag-pill">' +
      escapeHtml(slide.tag) +
      "</span></div>" +
      '<span class="slide-counter-pill">' +
      pad3(slide.number) +
      " / " +
      pad3(total) +
      "</span></div>" +
      '<div class="slide-headline">' +
      "<h1>" +
      formatInlineCode(slide.title) +
      "</h1>" +
      '<p class="slide-subtitle">' +
      formatInlineCode(slide.subtitle) +
      "</p></div>" +
      '<div class="slide-def-box">' +
      '<span class="slide-def-kicker">Définition</span>' +
      '<p class="slide-def-text">' +
      formatInlineCode(slide.definition) +
      "</p></div></div>" +
      bodyHtml +
      (slide.takeaway
        ? '<div class="slide-takeaway-bar"><span class="slide-takeaway-tag">À retenir</span><span>' +
          formatInlineCode(slide.takeaway) +
          "</span></div>"
        : "")
    );
  }

  function renderCurrentSlide() {
    const slides = DECK.slides || [];
    if (!slides.length) return;
    if (currentIdx < 0) currentIdx = 0;
    if (currentIdx >= slides.length) currentIdx = slides.length - 1;

    const slide = slides[currentIdx];
    const stage = document.getElementById("slide-stage");
    if (stage) {
      stage.innerHTML = buildSlideInnerHtml(slide, slides.length, false);
      stage.scrollTop = 0;
    }

    const pct = ((currentIdx + 1) / slides.length) * 100;
    const fill = document.getElementById("deck-progress-fill");
    if (fill) fill.style.width = pct.toFixed(2) + "%";

    const sel = document.getElementById("deck-part-select");
    if (sel && sel.value !== slide.part_id) {
      sel.value = slide.part_id;
    }

    const posLabel = document.getElementById("deck-pos-label");
    if (posLabel) {
      posLabel.textContent = "Diapositive " + (currentIdx + 1) + " sur " + slides.length;
    }

    try {
      history.replaceState(null, "", "#slide-" + (currentIdx + 1));
      localStorage.setItem("isgp-tornado-slide-idx", String(currentIdx));
    } catch (e) {}
  }

  function populatePartsDropdown() {
    const sel = document.getElementById("deck-part-select");
    if (!sel) return;
    sel.innerHTML = (DECK.parts || [])
      .map(
        (p) =>
          '<option value="' +
          escapeHtml(p.part_id) +
          '">' +
          escapeHtml(p.part_title) +
          " (" +
          p.first_slide +
          "–" +
          p.last_slide +
          ")</option>"
      )
      .join("");
    sel.addEventListener("change", () => {
      const part = (DECK.parts || []).find((x) => x.part_id === sel.value);
      if (part) {
        currentIdx = part.first_slide - 1;
        renderCurrentSlide();
      }
    });
  }

  function renderGridCards(query) {
    const container = document.getElementById("deck-grid-cards");
    const countSpan = document.getElementById("deck-grid-count");
    if (!container) return;
    const q = String(query || "").trim().toLowerCase();
    const matches = (DECK.slides || []).filter((s) => {
      if (!q) return true;
      const hay = [
        s.title,
        s.subtitle,
        s.definition,
        s.tag,
        s.part_title,
        s.code,
        s.takeaway,
        ...(s.points || []).map((p) => (p.label || "") + " " + (p.text || "")),
      ]
        .join(" ")
        .toLowerCase();
      return hay.includes(q);
    });
    if (countSpan) {
      countSpan.textContent = matches.length + " / " + (DECK.slides || []).length + " diapositives";
    }
    container.innerHTML = matches
      .map(
        (s) =>
          '<button type="button" class="deck-mini-card ' +
          (s.number - 1 === currentIdx ? "active" : "") +
          '" onclick="window.jumpToSlideNumber(' +
          s.number +
          ')">' +
          '<div class="deck-mini-top"><span>#' +
          pad3(s.number) +
          " • " +
          escapeHtml(s.part_id) +
          "</span><span>" +
          escapeHtml(s.tag) +
          "</span></div>" +
          '<div class="deck-mini-title">' +
          escapeHtml(s.title) +
          "</div>" +
          '<div class="deck-mini-sub">' +
          escapeHtml(s.subtitle) +
          "</div></button>"
      )
      .join("");
  }

  window.prevSlide = function () {
    if (currentIdx > 0) {
      currentIdx -= 1;
      renderCurrentSlide();
    }
  };

  window.nextSlide = function () {
    if (currentIdx < (DECK.slides || []).length - 1) {
      currentIdx += 1;
      renderCurrentSlide();
    }
  };

  window.jumpToSlideNumber = function (num) {
    currentIdx = Math.max(0, Math.min((DECK.slides || []).length - 1, Number(num) - 1));
    window.closeDeckGrid();
    renderCurrentSlide();
  };

  window.toggleDeckGrid = function () {
    const overlay = document.getElementById("deck-grid-overlay");
    if (!overlay) return;
    const opening = overlay.classList.contains("hidden");
    overlay.classList.toggle("hidden", !opening);
    if (opening) {
      const topSearch = document.getElementById("deck-search-input");
      renderGridCards(topSearch ? topSearch.value : "");
    }
  };

  window.closeDeckGrid = function () {
    const overlay = document.getElementById("deck-grid-overlay");
    if (overlay) overlay.classList.add("hidden");
  };

  window.toggleDeckTheme = function () {
    const cur = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try {
      localStorage.setItem("isgp-slides-theme", next);
    } catch (e) {}
    const btn = document.getElementById("deck-theme-btn");
    if (btn) btn.textContent = next === "dark" ? "Mode Clair" : "Mode Sombre";
  };

  window.toggleDeckFullscreen = async function () {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
        if (screen.orientation && screen.orientation.lock) {
          try {
            await screen.orientation.lock("landscape");
          } catch (e) {}
        }
      } else {
        await document.exitFullscreen();
      }
    } catch (e) {}
  };

  window.copyCurrentSlideCode = function (btnEl) {
    const s = (DECK.slides || [])[currentIdx];
    if (!s || !s.code || !navigator.clipboard) return;
    navigator.clipboard.writeText(s.code).then(() => {
      if (btnEl) {
        const prev = btnEl.textContent;
        btnEl.textContent = "Copié";
        setTimeout(() => {
          btnEl.textContent = prev;
        }, 1200);
      }
    });
  };

  window.printAllSlides = function () {
    const printRoot = document.getElementById("deck-print-all");
    const slides = DECK.slides || [];
    if (printRoot && !printRoot.hasChildNodes()) {
      printRoot.innerHTML = slides
        .map(
          (s) =>
            '<section class="print-slide-page">' +
            buildSlideInnerHtml(s, slides.length, true) +
            "</section>"
        )
        .join("");
    }
    window.print();
  };

  function bindEvents() {
    const searchInput = document.getElementById("deck-search-input");
    if (searchInput) {
      searchInput.addEventListener("input", () => {
        const overlay = document.getElementById("deck-grid-overlay");
        if (overlay && overlay.classList.contains("hidden") && searchInput.value.trim().length > 0) {
          overlay.classList.remove("hidden");
        }
        renderGridCards(searchInput.value);
      });
    }

    document.addEventListener("keydown", (ev) => {
      const tag = (ev.target && ev.target.tagName) || "";
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") {
        if (ev.key === "Escape") {
          ev.target.blur();
          window.closeDeckGrid();
        }
        return;
      }
      if (ev.key === "ArrowRight" || ev.key === "PageDown" || ev.key === " ") {
        ev.preventDefault();
        window.nextSlide();
      } else if (ev.key === "ArrowLeft" || ev.key === "PageUp") {
        ev.preventDefault();
        window.prevSlide();
      } else if (ev.key === "Home") {
        ev.preventDefault();
        currentIdx = 0;
        renderCurrentSlide();
      } else if (ev.key === "End") {
        ev.preventDefault();
        currentIdx = Math.max(0, (DECK.slides || []).length - 1);
        renderCurrentSlide();
      } else if (ev.key === "g" || ev.key === "G") {
        ev.preventDefault();
        window.toggleDeckGrid();
      } else if (ev.key === "f" || ev.key === "F") {
        ev.preventDefault();
        window.toggleDeckFullscreen();
      } else if (ev.key === "t" || ev.key === "T") {
        ev.preventDefault();
        window.toggleDeckTheme();
      } else if (ev.key === "/") {
        ev.preventDefault();
        if (searchInput) searchInput.focus();
      } else if (ev.key === "Escape") {
        window.closeDeckGrid();
      }
    });

    const viewport = document.querySelector(".deck-viewport");
    if (viewport) {
      viewport.addEventListener("touchstart", (ev) => {
        if (ev.changedTouches && ev.changedTouches[0]) {
          touchStartX = ev.changedTouches[0].clientX;
        }
      });
      viewport.addEventListener("touchend", (ev) => {
        if (touchStartX === null || !ev.changedTouches || !ev.changedTouches[0]) return;
        const dx = ev.changedTouches[0].clientX - touchStartX;
        touchStartX = null;
        if (Math.abs(dx) > 55) {
          if (dx < 0) window.nextSlide();
          else window.prevSlide();
        }
      });
    }
  }

  async function initDeck() {
    try {
      const savedTheme = localStorage.getItem("isgp-slides-theme");
      const theme = savedTheme === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      const btn = document.getElementById("deck-theme-btn");
      if (btn) btn.textContent = theme === "dark" ? "Mode Clair" : "Mode Sombre";
    } catch (e) {}

    const inlineEl = document.getElementById("slides-deck-data");
    if (inlineEl && inlineEl.textContent.trim()) {
      DECK = JSON.parse(inlineEl.textContent);
    } else {
      const res = await fetch("/api/slides/tornado");
      DECK = await res.json();
    }

    populatePartsDropdown();
    bindEvents();

    const m = (window.location.hash || "").match(/^#slide-(\d+)$/);
    if (m) {
      currentIdx = Math.max(0, parseInt(m[1], 10) - 1);
    } else {
      try {
        const savedIdx = parseInt(localStorage.getItem("isgp-tornado-slide-idx") || "0", 10);
        if (!isNaN(savedIdx) && savedIdx >= 0) currentIdx = savedIdx;
      } catch (e) {}
    }
    renderCurrentSlide();
  }

  document.addEventListener("DOMContentLoaded", initDeck);
})();

</script>
</body>
</html>
