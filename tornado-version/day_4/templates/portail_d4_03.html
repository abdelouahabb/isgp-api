<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Jour 4.3 — Rate Limiting a Fenetre Glissante (429 Too Many Requests)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #1e3a5f; color: #fff; padding: 18px 28px; }
    main { max-width: 900px; margin: 22px auto; padding: 0 20px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 18px; }
    button { background: #1e3a5f; color: #fff; border: none; border-radius: 6px; padding: 10px 16px; font-weight: 600; cursor: pointer; margin-right: 8px; }
    pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header><h1>Jour 4.3 — Quota par IP (3 requetes / 20s) &amp; En-tete Retry-After</h1></header>
  <main>
    <div class="card">
      <p>Cliquez plus de 3 fois en moins de 20 secondes pour declencher <code>429 Too Many Requests</code> :</p>
      <button type="button" onclick="appeler()">Appeler GET /api/catalogue-protege</button>
      <pre id="sortie">En attente d'appel...</pre>
    </div>
  </main>
  <script>
    async function appeler() {
      const rep = await fetch("/api/catalogue-protege");
      const data = await rep.json();
      const resume = {
        http_status: rep.status,
        headers: {
          "X-RateLimit-Limit": rep.headers.get("X-RateLimit-Limit"),
          "X-RateLimit-Remaining": rep.headers.get("X-RateLimit-Remaining"),
          "Retry-After": rep.headers.get("Retry-After")
        },
        body: data
      };
      document.getElementById("sortie").textContent = JSON.stringify(resume, null, 2);
    }
  </script>
</body>
</html>
