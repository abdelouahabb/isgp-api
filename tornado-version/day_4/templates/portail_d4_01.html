<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Jour 4.1 — Authentification X-API-Key &amp; hmac.compare_digest</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #1e3a5f; color: #fff; padding: 18px 28px; }
    main { max-width: 900px; margin: 22px auto; padding: 0 20px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 18px; }
    input, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #94a3b8; margin-right: 6px; font-size: 0.88rem; }
    button { background: #1e3a5f; color: #fff; border: none; font-weight: 600; cursor: pointer; }
    button.err { background: #b91c1c; }
    pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header><h1>Jour 4.1 — Authentification Machine-a-Machine par X-API-Key</h1></header>
  <main>
    <div class="card">
      <p>Testez <code>GET /api/admin/statistiques</code> avec ou sans la cle secrete verifiee en temps constant :</p>
      <input id="cle" type="text" value="isgp-secret-2026" style="width:240px;" />
      <button type="button" onclick="appeler(document.getElementById('cle').value)">Envoyer avec X-API-Key</button>
      <button type="button" class="err" onclick="appeler('')">Tester sans cle (401)</button>
      <pre id="sortie"></pre>
    </div>
  </main>
  <script>
    async function appeler(cle) {
      const headers = cle ? { "X-API-Key": cle } : {};
      const rep = await fetch("/api/admin/statistiques", { headers });
      document.getElementById("sortie").textContent = `HTTP ${rep.status}\n` + JSON.stringify(await rep.json(), null, 2);
    }
    appeler("isgp-secret-2026");
  </script>
</body>
</html>
