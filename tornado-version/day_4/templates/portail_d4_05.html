<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Jour 4.5 — CORS, En-tetes OWASP &amp; Verification HMAC-SHA256 de Webhook</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #1e3a5f; color: #fff; padding: 18px 28px; }
    main { max-width: 960px; margin: 22px auto; padding: 0 20px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 18px; }
    button { background: #1e3a5f; color: #fff; border: none; border-radius: 6px; padding: 9px 14px; font-weight: 600; cursor: pointer; margin-right: 8px; }
    button.err { background: #b91c1c; }
    pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 6px; overflow-x: auto; font-size: 0.84rem; }
  </style>
</head>
<body>
  <header><h1>Jour 4.5 — Verification HMAC-SHA256 d'un Webhook &amp; En-tetes OWASP</h1></header>
  <main>
    <div class="card">
      <p>Simulez un envoi de Webhook partenaire vers <code>POST /api/webhooks/paiement</code> :</p>
      <button type="button" onclick="envoyerWebhook(true)">1. Envoyer avec Signature HMAC-SHA256 Valide (200)</button>
      <button type="button" class="err" onclick="envoyerWebhook(false)">2. Envoyer avec Signature Falsifiee (401)</button>
      <pre id="sortie"></pre>
    </div>
  </main>
  <script>
    async function calculerHmacHex(secret, message) {
      const enc = new TextEncoder();
      const cle = await crypto.subtle.importKey("raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
      const sig = await crypto.subtle.sign("HMAC", cle, enc.encode(message));
      return "sha256=" + Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
    async function envoyerWebhook(valide) {
      const corps = JSON.stringify({ evenement: "paiement.reussi", montant_dzd: 65000 });
      const signature = valide ? await calculerHmacHex("whsec_isgp_partenaire_2026", corps) : "sha256=0000falsifie";
      const rep = await fetch("/api/webhooks/paiement", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Webhook-Signature": signature },
        body: corps
      });
      const resume = {
        status: rep.status,
        headers_securite: {
          "X-Content-Type-Options": rep.headers.get("X-Content-Type-Options"),
          "X-Frame-Options": rep.headers.get("X-Frame-Options"),
          "Cache-Control": rep.headers.get("Cache-Control")
        },
        body: await rep.json()
      };
      document.getElementById("sortie").textContent = JSON.stringify(resume, null, 2);
    }
    envoyerWebhook(true);
  </script>
</body>
</html>
