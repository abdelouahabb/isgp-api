<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Catalogue SQLite &amp; Formulaire Tornado — ISGP</title>
</head>
<body>
  <h1>Catalogue SQLite des Formations ISGP (Tornado)</h1>

  {% if message %}
    <div class="notification-succes">{{ message }}</div>
  {% end %}

  <!-- Formulaire HTML envoyant ses champs dans self.get_body_argument vers SQLite -->
  <form method="POST" action="/formations-sqlite">
    <input type="text" name="titre" placeholder="Intitulé de la formation" required />
    <input type="number" name="duree_jours" value="5" min="1" max="30" required />
    <input type="text" name="salle" value="Salle A" />
    <button type="submit">Ajouter dans SQLite (POST self.get_body_argument)</button>
  </form>

  <!-- Tableau alimenté depuis SQLite et rendu par boucle tornado.template -->
  <table>
    <thead>
      <tr><th>ID</th><th>Titre</th><th>Durée</th><th>Salle</th></tr>
    </thead>
    <tbody>
      {% for f in formations %}
      <tr>
        <td>#{{ f["id"] }}</td>
        <td>{{ f["titre"] }}</td>
        <td>{{ f["duree_jours"] }} jours</td>
        <td>{{ f["salle"] }}</td>
      </tr>
      {% end %}
    </tbody>
  </table>
</body>
</html>
