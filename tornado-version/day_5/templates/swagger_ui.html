<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; background: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .isgp-swagger-bar {
      background: #1e3a5f; color: #ffffff; padding: 10px 20px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #0f172a; font-size: 14px; flex-wrap: wrap; gap: 10px;
    }
    .isgp-swagger-bar a {
      color: #ffffff; text-decoration: none; background: rgba(255, 255, 255, 0.16);
      padding: 5px 12px; border-radius: 4px; font-weight: 600; font-size: 13px;
    }
    .isgp-swagger-bar a:hover { background: rgba(255, 255, 255, 0.28); }
  </style>
</head>
<body>
  <div class="isgp-swagger-bar">
    <div>
      <strong>{{ header_title }}</strong>
      &nbsp;|&nbsp; Astuce : Cliquez sur <strong>Authorize</strong> (X-API-Key : <code>{{ demo_api_key }}</code>) puis sur <strong>Try it out</strong>
    </div>
    <div style="display:flex; gap:8px;">
      <a href="/">Portail Web (GET /)</a>
      <a href="{{ openapi_url }}" target="_blank">Contrat {{ openapi_url }}</a>
      <a href="/api/v1/formations" target="_blank">GET /api/v1/formations</a>
    </div>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      if (window.SwaggerUIBundle) {
        window.SwaggerUIBundle({
          url: "{{ openapi_url }}",
          dom_id: "#swagger-ui",
          deepLinking: true,
          persistAuthorization: true,
          docExpansion: "list",
          defaultModelsExpandDepth: 1
        });
      }
    };
  </script>
</body>
</html>
