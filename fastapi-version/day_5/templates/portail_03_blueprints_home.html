<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISGP Jour 5.3 - APIRouter, Versioning v1/v2 (RFC 8594) & Healthchecks</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f7fa; color: #1e293b; margin: 0; padding: 1.5rem; }
    .carte { max-width: 960px; margin: 0 auto; background: #fff; border: 1px solid #d8e1e8; border-radius: 10px; padding: 1.5rem; }
    h1 { color: #0f2b46; margin-top: 0; font-size: 1.38rem; }
    .ligne { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    button, a.btn { background: #0f2b46; color: #fff; border: none; border-radius: 6px; padding: 0.52rem 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .btn-warn { background: #b45309; }
    a.btn { background: #1d6fa5; }
    pre { background: #0f172a; color: #e2e8f0; padding: 0.9rem; border-radius: 8px; overflow-x: auto; font-size: 0.82rem; min-height: 150px; }
  </style>
</head>
<body>
  <main class="carte">
    <h1>Jour 5.3 — Architecture APIRouter : Versioning v1 (RFC 8594) vs v2 &amp; Sondes</h1>
    <div class="ligne">
      <button type="button" class="btn-warn" onclick="tester('/api/v1/formations')">GET /api/v1/formations (Depreciee)</button>
      <button type="button" onclick="tester('/api/v2/formations')">GET /api/v2/formations (Actuelle)</button>
      <button type="button" onclick="tester('/api/health/live')">GET /api/health/live</button>
      <button type="button" onclick="tester('/api/health/ready')">GET /api/health/ready</button>
      <a class="btn" href="/portail">Vue Jinja2 (/portail)</a>
      <a class="btn" href="/docs" target="_blank">Swagger UI (/docs)</a>
    </div>
    <pre id="sortie">Comparez les en-tetes Deprecation / Sunset de v1 et l'enveloppe enrichie de v2...</pre>
  </main>
  <script>
    async function tester(url) {
      const rep = await fetch(url);
      const entetes = ["x-api-version", "deprecation", "sunset", "link"].filter(k => rep.headers.get(k)).map(k => `${k}: ${rep.headers.get(k)}`).join(" | ");
      document.getElementById("sortie").textContent = `GET ${url} -> HTTP ${rep.status}\n${entetes ? entetes + "\n\n" : "\n"}` + JSON.stringify(await rep.json(), null, 2);
    }
    tester("/api/v2/formations");
  </script>
</body>
</html>
