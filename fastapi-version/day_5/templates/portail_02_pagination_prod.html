<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISGP Jour 5.2 - Pagination Offset/Limit vs Cursor Keyset</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f7fa; color: #1e293b; margin: 0; padding: 1.5rem; }
    .carte { max-width: 940px; margin: 0 auto; background: #fff; border: 1px solid #d8e1e8; border-radius: 10px; padding: 1.5rem; }
    h1 { color: #0f2b46; margin-top: 0; font-size: 1.38rem; }
    .ligne { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    button, a.btn { background: #0f2b46; color: #fff; border: none; border-radius: 6px; padding: 0.52rem 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .btn-sec { background: #1d6fa5; }
    pre { background: #0f172a; color: #e2e8f0; padding: 0.9rem; border-radius: 8px; overflow-x: auto; font-size: 0.82rem; min-height: 150px; }
  </style>
</head>
<body>
  <main class="carte">
    <h1>Jour 5.2 — Pagination Offset/Limit vs Curseur O(1) en Production</h1>
    <div class="ligne">
      <button type="button" onclick="appeler('/api/v1/catalogue/offset?sort=-tarif_dzd&page=1&per_page=2')">Offset/Limit (Tri -tarif_dzd)</button>
      <button type="button" class="btn-sec" onclick="appeler('/api/v1/catalogue/cursor?after_id=0&limit=2')">Curseur (after_id=0)</button>
      <button type="button" class="btn-sec" onclick="appeler('/api/v1/catalogue/cursor?after_id=2&limit=2')">Curseur Suivant (after_id=2)</button>
      <a class="btn" href="/docs" target="_blank">Swagger UI (/docs)</a>
    </div>
    <pre id="sortie">Chargement...</pre>
  </main>
  <script>
    async function appeler(url) {
      const rep = await fetch(url);
      document.getElementById("sortie").textContent = `GET ${url} -> HTTP ${rep.status}\n\n` + JSON.stringify(await rep.json(), null, 2);
    }
    appeler("/api/v1/catalogue/offset?sort=-tarif_dzd&page=1&per_page=2");
  </script>
</body>
</html>
