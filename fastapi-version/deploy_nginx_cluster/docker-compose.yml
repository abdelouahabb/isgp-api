# ==============================================================================
# FICHIER : deploy_nginx_cluster/docker-compose.yml
# OBJECTIF : Déployer en 1 commande (`docker compose up -d`) :
#   - 4 conteneurs FastAPI / Uvicorn ASGI (fastapi_node_1 à fastapi_node_4 sur 8001..8004)
#   - 1 conteneur Nginx Load Balancer & Static File Server (port 80)
# ==============================================================================
services:
  fastapi_node_1:
    build: ..
    environment:
      - INSTANCE_ID=fastapi-node-1
      - PORT=8001
    command: uvicorn deploy_nginx_cluster.instance_fastapi:app --host 0.0.0.0 --port 8001 --workers 2 --proxy-headers --forwarded-allow-ips="*"

  fastapi_node_2:
    build: ..
    environment:
      - INSTANCE_ID=fastapi-node-2
      - PORT=8002
    command: uvicorn deploy_nginx_cluster.instance_fastapi:app --host 0.0.0.0 --port 8002 --workers 2 --proxy-headers --forwarded-allow-ips="*"

  fastapi_node_3:
    build: ..
    environment:
      - INSTANCE_ID=fastapi-node-3
      - PORT=8003
    command: uvicorn deploy_nginx_cluster.instance_fastapi:app --host 0.0.0.0 --port 8003 --workers 2 --proxy-headers --forwarded-allow-ips="*"

  fastapi_node_4:
    build: ..
    environment:
      - INSTANCE_ID=fastapi-node-4
      - PORT=8004
    command: uvicorn deploy_nginx_cluster.instance_fastapi:app --host 0.0.0.0 --port 8004 --workers 2 --proxy-headers --forwarded-allow-ips="*"

  nginx_lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx_isgp_cluster.conf:/etc/nginx/conf.d/default.conf:ro
      - ../static:/home/abdelouahab/isgp-api/fastapi-version/static:ro
    depends_on:
      - fastapi_node_1
      - fastapi_node_2
      - fastapi_node_3
      - fastapi_node_4
