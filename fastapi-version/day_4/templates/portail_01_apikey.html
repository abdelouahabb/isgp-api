<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISGP Jour 4.1 - Secrets & Authentification X-API-Key</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f7fa; color: #1e293b; margin: 0; padding: 1.5rem; }
    .carte { max-width: 900px; margin: 0 auto; background: #fff; border: 1px solid #d8e1e8; border-radius: 10px; padding: 1.5rem; }
    h1 { color: #0f2b46; margin-top: 0; font-size: 1.38rem; }
    .ligne { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    input { padding: 0.48rem 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.88rem; }
    button, a.btn { background: #0f2b46; color: #fff; border: none; border-radius: 6px; padding: 0.52rem 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.86rem; }
    .btn-err { background: #b91c1c; }
    a.btn { background: #1d6fa5; }
    pre { background: #0f172a; color: #e2e8f0; padding: 0.9rem; border-radius: 8px; overflow-x: auto; font-size: 0.82rem; min-height: 130px; }
  </style>
</head>
<body>
  <main class="carte">
    <h1>Jour 4.1 — Protection par En-tete X-API-Key &amp; hmac.compare_digest</h1>
    <div class="ligne">
      <input id="cle" value="isgp-secret-2026" style="width:210px;">
      <button type="button" onclick="appeler(document.getElementById('cle').value)">GET avec X-API-Key (200)</button>
      <button type="button" class="btn-err" onclick="appeler('')">GET sans X-API-Key (401)</button>
      <a class="btn" href="/docs" target="_blank">Swagger UI (/docs)</a>
    </div>
    <pre id="sortie">Pret.</pre>
  </main>
  <script>
    async function appeler(cle) {
      const headers = cle ? { "X-API-Key": cle } : {};
      const rep = await fetch("/api/admin/statistiques", { headers });
      document.getElementById("sortie").textContent = `GET /api/admin/statistiques -> HTTP ${rep.status}\n\n` + JSON.stringify(await rep.json(), null, 2);
    }
    appeler("isgp-secret-2026");
  </script>
</body>
</html>
