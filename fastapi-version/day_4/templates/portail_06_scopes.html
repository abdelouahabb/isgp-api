<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISGP Jour 4.6 - AuthN (401) vs AuthZ (403, Scopes, Anti-BOLA)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f7fa; color: #1e293b; margin: 0; padding: 1.5rem; }
    .carte { max-width: 940px; margin: 0 auto; background: #fff; border: 1px solid #d8e1e8; border-radius: 10px; padding: 1.5rem; }
    h1 { color: #0f2b46; margin-top: 0; font-size: 1.38rem; }
    .ligne { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    button, a.btn { background: #0f2b46; color: #fff; border: none; border-radius: 6px; padding: 0.52rem 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .btn-err { background: #b91c1c; }
    a.btn { background: #1d6fa5; }
    pre { background: #0f172a; color: #e2e8f0; padding: 0.9rem; border-radius: 8px; overflow-x: auto; font-size: 0.82rem; min-height: 140px; }
  </style>
</head>
<body>
  <main class="carte">
    <h1>Jour 4.6 — AuthN (401) vs AuthZ (403 : Scopes &amp; Protection Anti-BOLA)</h1>
    <div class="ligne">
      <button type="button" class="btn-err" onclick="lire(101, '')">Sans jeton -> 401 AuthN</button>
      <button type="button" onclick="lire(101, TOK_AMINE)">Amine lit Dossier #101 (Amine) -> 200</button>
      <button type="button" class="btn-err" onclick="lire(102, TOK_AMINE)">Amine lit Dossier #102 (Sara) -> 403 BOLA</button>
      <button type="button" onclick="lire(102, TOK_ADMIN)">Directeur Admin lit #102 -> 200</button>
      <a class="btn" href="/docs" target="_blank">Swagger UI (/docs)</a>
    </div>
    <pre id="sortie">Comparez 401 (identite inconnue) et 403 (acces interdit a l'objet d'autrui - BOLA)...</pre>
  </main>
  <script>
    const TOK_AMINE = {{ token_amine | tojson }};
    const TOK_ADMIN = {{ token_admin | tojson }};
    async function lire(id, tok) {
      const headers = tok ? { "Authorization": "Bearer " + tok } : {};
      const rep = await fetch("/api/v1/dossiers/" + id, { headers });
      document.getElementById("sortie").textContent = `GET /api/v1/dossiers/${id} -> HTTP ${rep.status}\n\n` + JSON.stringify(await rep.json(), null, 2);
    }
  </script>
</body>
</html>
