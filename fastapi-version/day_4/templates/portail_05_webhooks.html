<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISGP Jour 4.5 - CORSMiddleware, Webhooks HMAC & En-tetes Securite</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f7fa; color: #1e293b; margin: 0; padding: 1.5rem; }
    .carte { max-width: 920px; margin: 0 auto; background: #fff; border: 1px solid #d8e1e8; border-radius: 10px; padding: 1.5rem; }
    h1 { color: #0f2b46; margin-top: 0; font-size: 1.38rem; }
    .ligne { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    button, a.btn { background: #0f2b46; color: #fff; border: none; border-radius: 6px; padding: 0.52rem 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.86rem; }
    .btn-err { background: #b91c1c; }
    a.btn { background: #1d6fa5; }
    pre { background: #0f172a; color: #e2e8f0; padding: 0.9rem; border-radius: 8px; overflow-x: auto; font-size: 0.82rem; min-height: 150px; }
  </style>
</head>
<body>
  <main class="carte">
    <h1>Jour 4.5 — Verification Webhook HMAC-SHA256 &amp; En-tetes Durcis</h1>
    <div class="ligne">
      <button type="button" onclick="envoyer(true)">POST Webhook HMAC Valide (200)</button>
      <button type="button" class="btn-err" onclick="envoyer(false)">POST Webhook Signature Falsifiee (401)</button>
      <a class="btn" href="/docs" target="_blank">Swagger UI (/docs)</a>
    </div>
    <pre id="sortie">Pret.</pre>
  </main>
  <script>
    const CHARGE_EXEMPLE = {{ charge_exemple | tojson }};
    const SIG_EXEMPLE = {{ signature_exemple | tojson }};
    async function envoyer(valide) {
      const sig = valide ? SIG_EXEMPLE : "sha256=signature_falsifiee";
      const rep = await fetch("/api/webhooks/paiement", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Webhook-Signature": sig },
        body: CHARGE_EXEMPLE
      });
      document.getElementById("sortie").textContent =
        `POST /api/webhooks/paiement -> HTTP ${rep.status}\nX-Content-Type-Options: ${rep.headers.get("x-content-type-options")}\nX-Frame-Options: ${rep.headers.get("x-frame-options")}\n\n` +
        JSON.stringify(await rep.json(), null, 2);
    }
    envoyer(true);
  </script>
</body>
</html>
