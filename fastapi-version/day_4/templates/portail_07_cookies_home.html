<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISGP Jour 4.7 - Cookies HttpOnly, SameSite & Sessions Signees</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f7fa; color: #1e293b; margin: 0; padding: 1.5rem; }
    .carte { max-width: 940px; margin: 0 auto; background: #fff; border: 1px solid #d8e1e8; border-radius: 10px; padding: 1.5rem; }
    h1 { color: #0f2b46; margin-top: 0; font-size: 1.38rem; }
    .ligne { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    input { padding: 0.48rem 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.88rem; }
    button, a.btn { background: #0f2b46; color: #fff; border: none; border-radius: 6px; padding: 0.52rem 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .btn-del { background: #b91c1c; }
    a.btn { background: #1d6fa5; }
    pre { background: #0f172a; color: #e2e8f0; padding: 0.9rem; border-radius: 8px; overflow-x: auto; font-size: 0.82rem; min-height: 150px; }
  </style>
</head>
<body>
  <main class="carte">
    <h1>Jour 4.7 — Cookies HttpOnly, SameSite &amp; Sessions Signees HMAC</h1>
    <div class="ligne">
      <input id="c-user" value="yasmine.merabet" style="width:170px;">
      <button type="button" onclick="loginCookie()">1. POST /api/auth/cookie-login</button>
      <button type="button" onclick="inspecterCookie()">2. GET /api/auth/cookie-inspect</button>
      <button type="button" class="btn-del" onclick="logoutCookie()">3. POST /api/auth/cookie-logout</button>
      <a class="btn" href="/portail-cookies">Portail Protege (/portail-cookies)</a>
      <a class="btn" href="/docs" target="_blank">Swagger UI (/docs)</a>
    </div>
    <pre id="sortie">Connectez-vous pour recevoir les cookies HttpOnly et inspecter document.cookie...</pre>
  </main>
  <script>
    async function loginCookie() {
      const rep = await fetch("/api/auth/cookie-login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ identifiant: document.getElementById("c-user").value, theme: "institutionnel" }) });
      document.getElementById("sortie").textContent = `POST /api/auth/cookie-login -> HTTP ${rep.status}\ndocument.cookie visible JS (HttpOnly masque les jetons !) : "${document.cookie}"\n\n` + JSON.stringify(await rep.json(), null, 2);
    }
    async function inspecterCookie() {
      const rep = await fetch("/api/auth/cookie-inspect");
      document.getElementById("sortie").textContent = `GET /api/auth/cookie-inspect -> HTTP ${rep.status}\n\n` + JSON.stringify(await rep.json(), null, 2);
    }
    async function logoutCookie() {
      const rep = await fetch("/api/auth/cookie-logout", { method: "POST" });
      document.getElementById("sortie").textContent = `POST /api/auth/cookie-logout -> HTTP ${rep.status}\n\n` + JSON.stringify(await rep.json(), null, 2);
    }
  </script>
</body>
</html>
