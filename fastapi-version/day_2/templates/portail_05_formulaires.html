<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISGP Jour 2.5 - Jinja2Templates, Formulaires & UploadFile</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f7fa; color: #1e293b; margin: 0; padding: 1.5rem; }
    .carte { max-width: 920px; margin: 0 auto; background: #fff; border: 1px solid #d8e1e8; border-radius: 10px; padding: 1.5rem; }
    h1 { color: #0f2b46; margin-top: 0; font-size: 1.38rem; }
    .ligne { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.8rem; align-items: center; }
    input { padding: 0.48rem 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.88rem; }
    button, a.btn { background: #0f2b46; color: #fff; border: none; border-radius: 6px; padding: 0.52rem 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.86rem; }
    a.btn { background: #1d6fa5; }
    pre { background: #0f172a; color: #e2e8f0; padding: 0.9rem; border-radius: 8px; overflow-x: auto; font-size: 0.83rem; min-height: 130px; }
  </style>
</head>
<body>
  <main class="carte">
    <h1>Jour 2.5 — Portail Hybride : Formulaires HTML, JSON &amp; Upload Multipart</h1>
    <div class="ligne">
      <input id="f-titre" value="Conception API Hybride" style="width:220px;">
      <input id="f-duree" type="number" value="4" style="width:70px;">
      <button type="button" onclick="creerJson()">POST /formations (JSON)</button>
      <button type="button" onclick="simulerUpload()">POST /formations/upload-syllabus (Multipart)</button>
      <a class="btn" href="/formations">Page Formulaire HTML (/formations)</a>
      <a class="btn" href="/docs" target="_blank">Swagger UI (/docs)</a>
    </div>
    <pre id="sortie">Utilisez les boutons ci-dessus ou ouvrez /formations...</pre>
  </main>
  <script>
    async function creerJson() {
      const corps = { titre: document.getElementById("f-titre").value, duree_jours: Number(document.getElementById("f-duree").value), salle: "Salle A" };
      const rep = await fetch("/formations", { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(corps) });
      document.getElementById("sortie").textContent = `POST /formations (JSON) -> HTTP ${rep.status}\n\n` + JSON.stringify(await rep.json(), null, 2);
    }
    async function simulerUpload() {
      const fd = new FormData();
      fd.append("code_formation", "API-205");
      fd.append("document_pdf", new Blob(["%PDF-1.4 Syllabus ISGP"], { type: "application/pdf" }), "syllabus_isgp 2026.pdf");
      const rep = await fetch("/formations/upload-syllabus", { method: "POST", body: fd });
      document.getElementById("sortie").textContent = `POST /formations/upload-syllabus -> HTTP ${rep.status}\n\n` + JSON.stringify(await rep.json(), null, 2);
    }
  </script>
</body>
</html>
