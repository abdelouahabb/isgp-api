<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISGP Jour 2.2 - Routage, Path & Query Parameters</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f7fa; color: #1e293b; margin: 0; padding: 1.5rem; }
    .carte { max-width: 920px; margin: 0 auto; background: #fff; border: 1px solid #d8e1e8; border-radius: 10px; padding: 1.5rem; }
    h1 { color: #0f2b46; margin-top: 0; font-size: 1.38rem; }
    .ligne { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
    input { padding: 0.48rem 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.88rem; }
    button, a.btn { background: #0f2b46; color: #fff; border: none; border-radius: 6px; padding: 0.52rem 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.86rem; }
    a.btn { background: #1d6fa5; }
    pre { background: #0f172a; color: #e2e8f0; padding: 0.9rem; border-radius: 8px; overflow-x: auto; font-size: 0.83rem; min-height: 120px; }
  </style>
</head>
<body>
  <main class="carte">
    <h1>Jour 2.2 — Portail Routage &amp; Parametres Types (Path + Query)</h1>
    <div class="ligne">
      <input id="p-prenom" value="Yasmine" placeholder="Prenom">
      <button type="button" onclick="saluer()">GET /api/saluer/{prenom}</button>
      <input id="p-id" type="number" value="1" style="width:75px;">
      <button type="button" onclick="stagiaire()">GET /api/v1/stagiaires/{id}</button>
      <a class="btn" href="/stagiaires/1/fiche">Fiche HTML #1</a>
      <a class="btn" href="/docs" target="_blank">Swagger UI (/docs)</a>
    </div>
    <div class="ligne">
      <input id="q-ht" type="number" value="2500" style="width:110px;">
      <input id="q-taux" type="number" value="19" style="width:90px;">
      <button type="button" onclick="calculTva()">GET /api/calcul-tva?ht=&amp;taux=</button>
    </div>
    <pre id="sortie">Pret.</pre>
  </main>
  <script>
    async function afficher(url) {
      const rep = await fetch(url);
      const data = await rep.json();
      document.getElementById("sortie").textContent = `GET ${url} -> HTTP ${rep.status}\n\n` + JSON.stringify(data, null, 2);
    }
    function saluer() { afficher("/api/saluer/" + encodeURIComponent(document.getElementById("p-prenom").value)); }
    function stagiaire() { afficher("/api/v1/stagiaires/" + encodeURIComponent(document.getElementById("p-id").value)); }
    function calculTva() { afficher(`/api/calcul-tva?ht=${document.getElementById("q-ht").value}&taux=${document.getElementById("q-taux").value}`); }
    saluer();
  </script>
</body>
</html>
